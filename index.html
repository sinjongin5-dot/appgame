// 타일링 가능한 값 노이즈 (fbm)
function tileNoise(size, seed) {
  const out = new Float32Array(size * size);
  const periods = [4, 8, 16, 32, 64, 128], amps = [1, .6, .38, .22, .12, .07];
  let tot = 0;
  for (let o = 0; o < periods.length; o++) {
    const P = periods[o], A = amps[o], cell = size / P, r = rng32(seed + o * 101);
    const lat = new Float32Array(P * P);
    for (let i = 0; i < P * P; i++) lat[i] = r();
    for (let y = 0; y < size; y++) {
      const fy = y / cell, iy = fy | 0, ty = smooth(fy - iy), y0 = iy % P, y1 = (iy + 1) % P;
      for (let x = 0; x < size; x++) {
        const fx = x / cell, ix = fx | 0, tx = smooth(fx - ix), x0 = ix % P, x1 = (ix + 1) % P;
        const a = lat[y0 * P + x0], b = lat[y0 * P + x1], c = lat[y1 * P + x0], d = lat[y1 * P + x1];
        out[y * size + x] += A * ((a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty);
      }
    }
    tot += A;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;
  return out;
}

// 섬유 한 가닥 (타일 경계에서 반대편으로 이어지게 9방향 반복)
function fiber(g, size, x, y, ang, len, w, color, bend) {
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  const mx = (x + ex) / 2 - Math.sin(ang) * bend, my = (y + ey) / 2 + Math.cos(ang) * bend;
  g.strokeStyle = color; g.lineWidth = w;
  const nearEdge = x < len || y < len || x > size - len || y > size - len;
  const offs = nearEdge ? [-size, 0, size] : [0];
  for (const ox of offs) for (const oy of offs) {
    g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(mx + ox, my + oy, ex + ox, ey + oy); g.stroke();
  }
}

// 바닥 와시 타일: 미색 + 얼룩진 구름 무늬 + 섬유 결 + 나무껍질 티
function makePaperTile(px, logical, seed) {
  const c = makeCanvas(px, px), g = c.getContext('2d');
  const n = tileNoise(px, seed), r = rng32(seed + 7);
  const img = g.createImageData(px, px), d = img.data;
  for (let i = 0; i < px * px; i++) {
    const m = (n[i] - 0.5) * 2, gr = (r() - 0.5) * 5;
    d[i * 4] = 242 + m * 9 + gr; d[i * 4 + 1] = 232 + m * 10 + gr; d[i * 4 + 2] = 213 + m * 15 + gr * 0.8; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const s = px / logical;
  g.save(); g.scale(s, s); g.lineCap = 'round';
  const L = logical;
  for (let i = 0; i < 650; i++) {
    const light = r() < 0.62;
    fiber(g, L, r() * L, r() * L, r() * TAU, 6 + r() * 26, 0.35 + r() * 0.7,
      light ? `rgba(255,252,244,${0.35 + r() * 0.35})` : `rgba(150,118,78,${0.06 + r() * 0.08})`, (r() - 0.5) * 6);
  }
  for (let i = 0; i < 60; i++) { // 길게 휜 닥나무 섬유
    fiber(g, L, r() * L, r() * L, r() * TAU, 40 + r() * 70, 0.6 + r() * 0.6, `rgba(255,253,246,${0.4 + r() * 0.3})`, (r() - 0.5) * 22);
  }
  for (let i = 0; i < 45; i++) { // 나무껍질 티
    g.fillStyle = `rgba(105,78,45,${0.12 + r() * 0.3})`;
    g.beginPath(); g.ellipse(r() * L, r() * L, 0.4 + r() * 1.1, 0.3 + r() * 0.6, r() * TAU, 0, TAU); g.fill();
  }
  g.restore();
  return c;
}

// 색지 표면용 중성 텍스처 (곱하기로 얹음)
function makeColorTex(size, seed) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const n = tileNoise(size, seed), r = rng32(seed + 3);
  const img = g.createImageData(size, size), d = img.data;
  for (let i = 0; i < size * size; i++) {
    const v = clamp(236 + (n[i] - 0.5) * 34 + (r() - 0.5) * 8, 0, 255);
    d[i * 4] = v; d[i * 4 + 1] = v - 1; d[i * 4 + 2] = v - 5; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const light = r() < 0.55;
    fiber(g, size, r() * size, r() * size, r() * TAU, 5 + r() * 22, 0.4 + r() * 0.8,
      light ? 'rgba(255,255,255,0.7)' : 'rgba(120,100,80,0.16)', (r() - 0.5) * 5);
  }
  return c;
}

let colorTex = null;
const texPatterns = new WeakMap();
function texPatternFor(g) {
  let p = texPatterns.get(g);
  if (!p) { p = g.createPattern(colorTex, 'repeat'); texPatterns.set(g, p); }
  return p;
}

// 찢어진 가장자리: 윤곽 법선 방향으로 저/고주파 노이즈 + 가끔 뜯긴 홈
function tornPoly(base, r, amp, fine, grow = 0) {
  const n = base.length, out = new Array(n);
  let area = 0;
  for (let i = 0; i < n; i++) { const a = base[i], b = base[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
  const sg = area > 0 ? 1 : -1;
  const f1 = 3 + ((r() * 4) | 0), f2 = 9 + ((r() * 6) | 0), p1 = r() * TAU, p2 = r() * TAU;
  for (let i = 0; i < n; i++) {
    const a = base[(i - 1 + n) % n], b = base[(i + 1) % n], p = base[i];
    let nx = (b[1] - a[1]) * sg, ny = -(b[0] - a[0]) * sg;
    const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
    const t = i / n * TAU;
    let d = amp * (0.6 * Math.sin(t * f1 + p1) + 0.4 * Math.sin(t * f2 + p2)) * 0.6 + (r() - 0.5) * 2 * fine + grow;
    if (r() < 0.04) d -= amp * 1.3;
    out[i] = [p[0] + nx * d, p[1] + ny * d];
  }
  return out;
}

// 색지 한 조각: 흰 섬유 단면 → 색면 → 섬유 결
function paperPiece(g, base, color, r, o = {}) {
  const amp = o.amp ?? 1.2;
  if (o.rim !== false) {
    const rim = tornPoly(base, r, amp * 1.1, amp * 0.9, Math.max(0.55, amp * 0.6));
    g.fillStyle = o.rimColor || 'rgba(251,247,236,0.96)'; pathPts(g, rim); g.fill();
  }
  const body = tornPoly(base, r, amp, amp * 0.45, 0);
  g.fillStyle = color; pathPts(g, body); g.fill();
  const tex = o.tex ?? 0.55;
  if (tex > 0) {
    g.save(); pathPts(g, body); g.clip();
    g.globalCompositeOperation = 'multiply'; g.globalAlpha = tex;
    g.fillStyle = texPatternFor(g); g.fillRect(-1000, -1000, 2000, 2000);
    g.restore();

}

// 붓선: 구간마다 굵기·농도가 달라지는 먹선
function brushOutline(g, pts, w, r, closed = true, color = PAL.sumi) {
  g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  const n = pts.length, m = closed ? n : n - 1, ph = r() * 10;
  for (let i = 0; i < m; i++) {
    const a = pts[i], b = pts[(i + 1) % n], t = i / m;
    let lw = w * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * TAU * 2 + ph)) + (r() - 0.5) * 0.25);
    if (!closed) lw *= 0.35 + 0.65 * Math.sin(Math.PI * clamp(t, 0.04, 0.96));
    if (closed && r() < 0.05) continue; // 붓이 살짝 뜨는 자리
    g.lineWidth = Math.max(0.2, lw);
    g.globalAlpha = 0.8 + r() * 0.2;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  g.globalAlpha = 1;
}
function brushLine(g, pts, w, r, color = PAL.sumi) {
  const dense = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], n = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 1.2));
    for (let k = 0; k < n; k++) { const t = k / n; dense.push([a[0] + (b[0] - a[0]) * t + (r() - 0.5) * 0.25, a[1] + (b[1] - a[1]) * t + (r() - 0.5) * 0.25]); }
  }
  dense.push(pts[pts.length - 1]);
  brushOutline(g, dense, w, r, false, color);
}

// 스프라이트: 논리 좌표로 그리고 내부적으로 SPR배 해상도
function buildSprite(w, h, ox, oy, fn, res = SPR) {
  const c = makeCanvas(w * res, h * res), g = c.getContext('2d');
  g.scale(res, res); g.translate(ox, oy); fn(g);
  return { c, w, h, ox, oy, res };
}
function silhouette(canvas, color) {
  const c = makeCanvas(canvas.width, canvas.height), g = c.getContext('2d');
  g.drawImage(canvas, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function softened(canvas, f = 3) { // 축소 후 확대로 흐림
  const s = makeCanvas(canvas.width / f, canvas.height / f);
  s.getContext('2d').drawImage(canvas, 0, 0, s.width, s.height);
  const o = makeCanvas(canvas.width, canvas.height), g = o.getContext('2d');
  g.imageSmoothingQuality = 'high'; g.drawImage(s, 0, 0, o.width, o.height);
  return o;
}

function pentagram(g, cx, cy, R, col, lw) {

function drawWingArt(g, r) { // 뿌리 = (0,0), 왼쪽 위로 펼쳐짐
  const feathers = [];
  for (let k = 0; k < 7; k++) feathers.push({ a: -Math.PI + 0.25 + k * 0.2, L: 46 - Math.abs(k - 2) * 4.5, w: 5.5 });
  for (const f of feathers) {
    const c = Math.cos(f.a), s = Math.sin(f.a), base = [c * 6, s * 6];
    const pts = [[base[0] - s * f.w * 0.5, base[1] + c * f.w * 0.5], [c * f.L * 0.55 - s * f.w, s * f.L * 0.55 + c * f.w], [c * f.L, s * f.L], [c * f.L * 0.55 + s * f.w * 0.3, s * f.L * 0.55 - c * f.w * 0.3]];
    const p = paperPiece(g, polyPts(pts, 1.5), PAL.sumi, r, { amp: 0.4, rimColor: 'rgba(248,241,226,0.9)' });
    brushLine(g, [[base[0], base[1]], [c * f.L * 0.9, s * f.L * 0.9]], 0.4, r, 'rgba(248,241,226,0.35)');
  }
  for (let k = 0; k < 4; k++) { // 덮깃
    const a = -Math.PI + 0.45 + k * 0.28, L = 20;
    paperPiece(g, polyPts([[0, 0], [Math.cos(a - 0.12) * L, Math.sin(a - 0.12) * L], [Math.cos(a + 0.1) * L * 1.05, Math.sin(a + 0.1) * L * 1.05]], 1.2), '#2b3a4f', r, { amp: 0.3 });
  }
}
function drawTailArt(g, r) { // 뿌리 = (0,0), 위로 솟음

  const tail = paperPiece(g, polyPts(L.concat(R), 1.5), '#f4ecda', r, { amp: 0.8 });
  g.save(); pathPts(g, tail); g.clip();

  g.restore();
  brushOutline(g, tail, 0.7, r, true, 'rgba(26,26,26,0.6)');
  for (let k = 0; k < 5; k++) { const y = -8 - k * 6; brushLine(g, [[-2, y], [1, y - 4]], 0.5, r, 'rgba(26,26,26,0.3)'); }
}

// 종이 공예 스티커: 흰 종이 여백 + 아주 옅은 먹 윤곽 (배경 위에서 또렷하게)
function stickerize(spr, white = 2.2, dark = 3) {
  const res = spr.res || SPR, pad = 4;
  const w = spr.w + pad * 2, h = spr.h + pad * 2;
  const c = makeCanvas(w * res, h * res), g = c.getContext('2d');
  const darkSil = silhouette(spr.c, 'rgba(40,30,22,0.55)'), whiteSil = silhouette(spr.c, '#f8f2e4');
  for (let k = 0; k < 16; k++) { const a = k / 16 * TAU; g.drawImage(darkSil, (pad + Math.cos(a) * dark) * res, (pad + Math.sin(a) * dark) * res); }
  for (let k = 0; k < 16; k++) { const a = k / 16 * TAU; g.drawImage(whiteSil, (pad + Math.cos(a) * white) * res, (pad + Math.sin(a) * white) * res); }
  g.drawImage(spr.c, pad * res, pad * res);
  return { c, w, h, ox: spr.ox + pad, oy: spr.oy + pad, res };
}

// 처치 시 찢어지는 조각: 중심에서 뻗은 지그재그 찢김선으로 분할
function makeFragments(spr, cx, cy, r, count) {
  const R = Math.max(spr.w, spr.h);
  const base = r() * TAU, angs = [];
  for (let i = 0; i < count; i++) angs.push(base + i * TAU / count + (r() - 0.5) * (TAU / count) * 0.45);
  const center = [cx + (r() - 0.5) * 3, cy + (r() - 0.5) * 3];
  const rays = angs.map(a => {
    const pts = [];
    for (let k = 1; k <= 7; k++) {
      const rr = k / 7 * R, perp = (r() - 0.5) * 5;
      pts.push([center[0] + Math.cos(a) * rr - Math.sin(a) * perp, center[1] + Math.sin(a) * rr + Math.cos(a) * perp]);
    }
    return pts;
  });
  const frags = [];
  for (let i = 0; i < count; i++) {
    const a0 = angs[i], a1 = angs[(i + 1) % count];
    let da = a1 - a0; while (da <= 0) da += TAU;
    const poly = [center, ...rays[i]];
    for (let k = 1; k < 4; k++) { const a = a0 + da * k / 4; poly.push([center[0] + Math.cos(a) * R * 1.3, center[1] + Math.sin(a) * R * 1.3]); }
    poly.push(...rays[(i + 1) % count].slice().reverse());
    const c = makeCanvas(spr.c.width, spr.c.height), g = c.getContext('2d');
    g.scale(spr.res || SPR, spr.res || SPR);
    g.save(); pathPts(g, poly); g.clip(); g.drawImage(spr.c, 0, 0, spr.w, spr.h); g.restore();
    g.globalCompositeOperation = 'source-atop';
    g.strokeStyle = 'rgba(251,246,234,0.95)'; g.lineWidth = 1.5; g.lineJoin = 'round';
    for (const ray of [rays[i], rays[(i + 1) % count]]) {
      g.beginPath(); g.moveTo(center[0], center[1]); for (const p of ray) g.lineTo(p[0], p[1]); g.stroke();
    }
    const am = a0 + da / 2;
    frags.push({
      c, back: silhouette(c, '#ebdfc6'),
      px: center[0] + Math.cos(am) * 7, py: center[1] + Math.sin(am) * 7, // 회전 중심(스프라이트 좌표)
      ang: am,
    });
  }
  return frags;
}

function makeBrushBar(w, h, color, seed, dry) {
  const r = rng32(seed);
  return buildSprite(w + 8, h + 8, 4, 4, g => {
    const top = [], bot = [];
    const N = 50;
    for (let i = 0; i <= N; i++) {
      const t = i / N, x = t * w;
      let th = h * (0.78 + 0.22 * Math.sin(t * 7 + 1) * 0.6 + (r() - 0.5) * 0.12);
      if (t < 0.04) th *= 0.75 + t * 6;
      if (t > 0.88) th *= 1 - (t - 0.88) * 3.2;
      const cy = h / 2 + Math.sin(t * 3.2) * 1.2;
      top.push([x, cy - th / 2]); bot.unshift([x, cy + th / 2]);

function makeStamp(size, lines, seed, font = FONT_SERIF) {
  const r = rng32(seed);
  return buildSprite(size + 8, size + 8, 4, 4, g => {
    const k = size * 0.14;
    const base = polyPts([[k, 0], [size - k, 0], [size, k], [size, size - k], [size - k, size], [k, size], [0, size - k], [0, k]], 2);
    const body = tornPoly(base, r, 1.1, 0.6);
    g.fillStyle = PAL.shu; pathPts(g, body); g.fill();
    g.save(); pathPts(g, body); g.clip();
    g.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 45; i++) { g.globalAlpha = 0.05 + r() * 0.25; g.beginPath(); g.arc(r() * size, r() * size, 0.6 + r() * 2.6, 0, TAU); g.fill(); }
    g.restore();
    g.strokeStyle = PAL.washiLight; g.lineWidth = 1.6;
    pathPts(g, tornPoly(polyPts([[5, 5], [size - 5, 5], [size - 5, size - 5], [5, size - 5]], 3), r, 0.6, 0.3)); g.stroke();
    g.fillStyle = PAL.washiLight; g.textAlign = 'center'; g.textBaseline = 'middle';
    const fs = size * (lines.length > 1 ? 0.27 : 0.38);
    let f = font === FONT_SERIF ? fs : fs * 1.5;
    g.font = `700 ${f}px ${font}`;
    const mw = Math.max(...lines.map(t => g.measureText(t).width));
    if (mw > size * 0.76) { f *= size * 0.76 / mw; g.font = `700 ${f}px ${font}`; }
    lines.forEach((t, i) => g.fillText(t, size / 2, size / 2 + (i - (lines.length - 1) / 2) * fs * 1.15));
  });
}

const scrollCache = new Map();
function getScroll(w, h) {

  let s = scrollCache.get(key);
  if (!s) { if (scrollCache.size > 8) scrollCache.clear(); s = makeScroll(Math.round(w), Math.round(h)); scrollCache.set(key, s); }

}
function makeScroll(w, h) {
  const r = rng32(77);
  return buildSprite(w + 24, h + 24, 12, 12, g => {
    paperPiece(g, polyPts([[0, 12], [w, 12], [w, h - 12], [0, h - 12]], 4), PAL.washiLight, r, { amp: 1.4, tex: 0.75 });
    g.save(); g.beginPath(); g.rect(4, h - 52, w - 8, 36); g.clip(); // 세이가이하
    g.strokeStyle = 'rgba(43,74,111,0.13)'; g.lineWidth = 1;
    const R = 12;
    for (let row = 0; row < 5; row++) for (let col = -1; col < w / (R * 2) + 1; col++) {
      const cx = col * R * 2 + (row % 2 ? R : 0), cy = h - 52 + row * R * 0.55 + R;
      for (let k = 3; k >= 1; k--) { g.beginPath(); g.arc(cx, cy, R * k / 3, Math.PI, TAU); g.stroke(); }
    }
    g.restore();
    for (const y of [8, h - 8]) {
      paperPiece(g, polyPts([[-8, y - 6], [w + 8, y - 6], [w + 8, y + 6], [-8, y + 6]], 3), PAL.ai, r, { amp: 0.5 });
      paperPiece(g, ellipsePts(-9, y, 4, 7.5, 16), PAL.odo, r, { amp: 0.4 });

    }
  });
}

function wrapLines(g, text, maxW) {
  const out = []; let cur = '';
  for (const word of String(text).split(' ')) {
    const test = cur ? cur + ' ' + word : word;
    if (g.measureText(test).width <= maxW) { cur = test; continue; }
    if (cur) out.push(cur);
    if (g.measureText(word).width > maxW) {
      let part = '';
      for (const ch of word) { if (g.measureText(part + ch).width > maxW) { out.push(part); part = ch; } else part += ch; }
      cur = part;
    } else cur = word;
  }
  if (cur) out.push(cur);
  return out;
}

// 대나무 무리
function drawBambooArt(g, r) {
  const n = 3 + ((r() * 3) | 0), culms = [];
  for (let i = 0; i < n; i++) culms.push({ x: (r() - 0.5) * 34, h: 100 + r() * 40, w: 4.2 + r() * 2, lean: (r() - 0.5) * 0.12 });
  culms.sort((a, b) => b.h - a.h);
  const blade = (ax, ay, ang, L, w, col) => {
    const c = Math.cos(ang), s = Math.sin(ang);
    const pts = [[0, 0], [L * 0.3, -w / 2], [L, 0], [L * 0.3, w / 2]].map(([x, y]) => [ax + x * c - y * s, ay + x * s + y * c]);
    paperPiece(g, polyPts(pts, 1.5), col, r, { amp: 0.25, tex: 0.35 });
  };
  for (const c of culms) {
    const tx = c.x + c.lean * c.h;
    const body = paperPiece(g, polyPts([[c.x - c.w / 2, 0], [c.x + c.w / 2, 0], [tx + c.w * 0.35, -c.h], [tx - c.w * 0.35, -c.h]], 2), r() < 0.5 ? PAL.bamboo : PAL.bambooL, r, { amp: 0.45 });
    brushOutline(g, body, 0.7, r, true, 'rgba(40,58,34,0.8)');
    for (let y = -14 - r() * 4; y > -c.h + 8; y -= 15 + r() * 5) {
      const x = c.x + c.lean * -y, ww = c.w * (1 - (-y / c.h) * 0.3);
      brushLine(g, [[x - ww / 2 - 0.8, y], [x + ww / 2 + 0.8, y]], 1, r, 'rgba(40,58,34,0.75)');
      brushLine(g, [[x - ww / 2 + 0.5, y - 1.4], [x + ww / 2 - 0.5, y - 1.4]], 0.5, r, 'rgba(248,241,226,0.55)');
    }
    const sprays = 3 + ((r() * 3) | 0);
    for (let k = 0; k < sprays; k++) {
      const t = 0.5 + r() * 0.5, ay = -c.h * t, ax = c.x + c.lean * c.h * t, side = r() < 0.5 ? -1 : 1;
      for (let b = 0; b < 3 + ((r() * 2) | 0); b++) {
        const ang = side > 0 ? 0.25 + r() * 0.9 : Math.PI - 0.25 - r() * 0.9;
        blade(ax, ay, ang, 11 + r() * 9, 2.6 + r() * 1.2, r() < 0.6 ? PAL.bambooD : PAL.bamboo);
      }
    }
  }
}

// 소나무
function drawPineArt(g, r) {
  const sp = [[0, 0], [(r() - 0.5) * 8, -25], [10 + (r() - 0.5) * 10, -50], [-4 + (r() - 0.5) * 10, -78], [6, -98]];
  const L = [], R = [];
  for (let i = 0; i < sp.length; i++) {
    const t = i / (sp.length - 1), w = 7.5 * (1 - t * 0.65);
    const a = sp[Math.max(0, i - 1)], b = sp[Math.min(sp.length - 1, i + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
    L.push([sp[i][0] + nx * w, sp[i][1] + ny * w]); R.unshift([sp[i][0] - nx * w, sp[i][1] - ny * w]);
  }
  // 가지
  const branch = (a, b, w) => {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), px = -Math.sin(ang) * w, py = Math.cos(ang) * w;
    outlined(g, [[a[0] + px, a[1] + py], [b[0] + px * 0.3, b[1] + py * 0.3], [b[0] - px * 0.3, b[1] - py * 0.3], [a[0] - px, a[1] - py]], PAL.bark, r, 0.4, 0.7);
  };
  branch(sp[2], [-30, -60], 3); branch(sp[2], [36, -74], 3); branch(sp[3], [-20, -94], 2.4); branch(sp[3], [18, -106], 2.4);
  const trunk = paperPiece(g, polyPts(L.concat(R), 2), PAL.bark, r, { amp: 0.8 });
  brushOutline(g, trunk, 1.1, r);
  for (let k = 0; k < 9; k++) { // 껍질 결
    const i = 1 + ((r() * 3) | 0), p = sp[i];
    brushLine(g, [[p[0] - 3 + r() * 6, p[1] + 6 - r() * 12], [p[0] - 3 + r() * 6, p[1] + 2 - r() * 12]], 0.7, r, 'rgba(26,26,26,0.5)');
  }
  const pads = [[-32, -62, 30, 11], [34, -76, 34, 12], [-20, -96, 28, 10], [16, -108, 26, 10], [44, -54, 20, 8]];
  for (const [x, y, rx, ry] of pads) {
    const jx = x + (r() - 0.5) * 6, jy = y + (r() - 0.5) * 4;
    const pad = paperPiece(g, ellipsePts(jx, jy, rx, ry, 36), PAL.pine, r, { amp: 1.8 });
    g.save(); pathPts(g, pad); g.clip();
    paperPiece(g, ellipsePts(jx - rx * 0.1, jy - ry * 0.45, rx * 0.8, ry * 0.6, 28), PAL.pineL, r, { amp: 1.2, rim: false });
    g.restore();
    brushOutline(g, pad.filter(p => p[1] > jy), 1, r, false);
    for (let k = 0; k < 9; k++) {
      const a = Math.PI + r() * Math.PI, px = jx + Math.cos(a) * rx * 0.85, py = jy + Math.sin(a) * ry * 0.85;
      brushLine(g, [[px, py], [px + (r() - 0.5) * 3, py - 3 - r() * 2]], 0.6, r, 'rgba(26,26,26,0.45)');
    }
  }
}

// 연못 충돌: 타원 물 영역, 단 다리 폭(가운데 세로 띠)은 지나갈 수 있다
const POND_BRIDGE_HALF = 15;
function pushOutOfPond(o, cx, cy, rad) {
  const dx = o.x - cx, dy = o.y - cy;
  if (Math.abs(dx) < POND_BRIDGE_HALF) return;
  const rx = POND_RX + rad * 0.4, ry = POND_RY + rad * 0.4;
  const q = (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry);
  if (q >= 1) return;
  const s = 1 / Math.sqrt(Math.max(q, 1e-6));
  const bx = dx * s, by = dy * s, dEdge = Math.hypot(bx - dx, by - dy);
  const dBridge = Math.abs(dx) - POND_BRIDGE_HALF + 1;
  if (dBridge < dEdge && Math.abs(dy) < POND_RY + 30) o.x = cx + Math.sign(dx) * (POND_BRIDGE_HALF - 1);
  else { o.x = cx + bx; o.y = cy + by; }
}

/* ---------- 2-6. 우키요에풍 먼 산 · 파도 띠 (가로로 이어지는 타일) ---------- */
function periodic(x, w, harm) { let s = 0; for (const [k, a, ph] of harm) s += a * Math.sin(TAU * k * x / w + ph); return s; }
function harmonics(r, ks, base) { return ks.map((k, i) => [k, base * Math.pow(0.68, i), r() * TAU]); }
function wrapDx(x, c, w) { return ((x - c) % w + w * 1.5) % w - w / 2; }

function makeMountainBand(w, h, seed, P = BAND_PAL[0]) {
  const r = rng32(seed), c = makeCanvas(w, h), g = c.getContext('2d');
  const hf = harmonics(r, [1, 2, 3, 5, 9, 17], 0.5), hn = harmonics(r, [2, 3, 4, 7, 13, 23], 0.45);
  const peakX = w * 0.32;
  const farY = x => {
    const f = Math.max(0, 1 - Math.abs(wrapDx(x, peakX, w)) / (w * 0.13));
    return h * 0.56 + h * 0.16 * periodic(x, w, hf) - h * 0.4 * Math.pow(f, 1.6);
  };
  const nearY = x => h * 0.8 + h * 0.08 * periodic(x, w, hn);
  const fillRange = (fy, top, bot) => {
    g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 4) g.lineTo(x, fy(x));
    g.lineTo(w, h); g.closePath();
    const gr = g.createLinearGradient(0, h * 0.1, 0, h);
    gr.addColorStop(0, top); gr.addColorStop(1, bot);
    g.fillStyle = gr; g.fill();
  };
  // 먼 산: 위가 진하고 아래로 옅어지는 보카시
  fillRange(farY, `rgba(${P.far},0.62)`, `rgba(${P.far},0.04)`);
  // 눈 덮인 봉우리
  if (P.snow) {
  g.save();
  g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 4) g.lineTo(x, farY(x)); g.lineTo(w, h); g.closePath(); g.clip();
  g.beginPath(); g.moveTo(0, 0);
  for (let x = 0; x <= w; x += 6) g.lineTo(x, h * 0.25 + Math.sin(x * 0.09) * 6 + Math.sin(x * 0.23 + 1) * 4 + (r() - 0.5) * 3);
  g.lineTo(w, 0); g.closePath(); g.fillStyle = 'rgba(248,241,226,0.94)'; g.fill();
  g.restore();
  }
  if (P.smoke) { // 화산 연기
    for (let k = 0; k < 9; k++) { const x0 = peakX + (r() - 0.5) * 20 + k * 6, y0 = farY(peakX) - 6 - k * 9, rr = 7 + k * 2.6; g.fillStyle = `rgba(60,46,44,${0.5 - k * 0.04})`; g.beginPath(); g.arc(x0, y0, rr, 0, TAU); g.fill(); }
    g.fillStyle = 'rgba(232,116,46,0.45)'; g.beginPath(); g.ellipse(peakX, farY(peakX) + 2, 10, 4, 0, 0, TAU); g.fill();
  }
  const ridge = []; for (let x = 0; x <= w; x += 6) ridge.push([x, farY(x)]);
  brushOutline(g, ridge, 1.4, r, false, 'rgba(26,26,26,0.35)');
  // 가까운 언덕 + 작은 솔
  fillRange(nearY, `rgba(${P.near},0.55)`, `rgba(${P.near},0.06)`);
  g.fillStyle = 'rgba(26,26,26,0.4)';
  for (let x = 10; x < w; x += 22 + r() * 40) {
    const y = nearY(x), s = 5 + r() * 6;
    g.beginPath(); g.moveTo(x, y - s * 1.6); g.lineTo(x + s * 0.7, y + 1); g.lineTo(x - s * 0.7, y + 1); g.fill();
  }
  // 가스미 (안개 띠): 종이를 길게 찢은 모양
  for (const [yy, n] of [[0.62, 2], [0.74, 2], [0.44, 1]]) {
    for (let i = 0; i < n; i++) {
      const L = w * (0.22 + r() * 0.2), x0 = r() * w, y0 = h * yy + (r() - 0.5) * 10, th = 8 + r() * 6;
      const base = polyPts([[0, 0], [L, 0], [L + th, th / 2], [L, th], [0, th], [-th, th / 2]], 4);
      for (const ox of [-w, 0, w]) {
        const pts = tornPoly(base.map(([x, y]) => [x + x0 + ox, y + y0]), r, 1.4, 0.6);
        g.fillStyle = 'rgba(248,241,226,0.92)'; pathPts(g, pts); g.fill();
        g.strokeStyle = 'rgba(201,162,74,0.35)'; g.lineWidth = 0.8; g.stroke();
      }
    }
  }
  // 학 무리
  g.strokeStyle = 'rgba(26,26,26,0.55)'; g.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const x = w * 0.6 + i * 16 + (r() - 0.5) * 10, y = h * 0.18 + i * 5 + (r() - 0.5) * 6, s = 3 + r() * 2;
    g.lineWidth = 1.1; g.beginPath(); g.moveTo(x - s, y - s * 0.5); g.quadraticCurveTo(x - s * 0.3, y, x, y + 0.5); g.quadraticCurveTo(x + s * 0.3, y, x + s, y - s * 0.6); g.stroke();
  }
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, h * 0.55, 0, h);
  fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fade; g.fillRect(0, 0, w, h);
  return c;
}

function makeWaveBand(w, h, seed, P = BAND_PAL[0]) {
  const r = rng32(seed), c = makeCanvas(w, h), g = c.getContext('2d');
  const hs = harmonics(r, [3, 5, 8, 13], 0.5);
  const crests = [0.1, 0.36, 0.63, 0.86].map(t => ({ x: w * t + (r() - 0.5) * 40, ht: h * (0.3 + r() * 0.18), wid: w * (0.06 + r() * 0.04) }));
  const waveY = x => {
    let y = h * 0.5 + h * 0.05 * periodic(x, w, hs);
    for (const cr of crests) {
      const dx = wrapDx(x, cr.x, w);
      const t = dx < 0 ? -dx / (cr.wid * 1.8) : dx / (cr.wid * 0.45);
      if (t < 1) y -= cr.ht * Math.pow(1 - t * t, dx < 0 ? 1.2 : 0.7);
    }
    return y;
  };
  g.beginPath(); g.moveTo(0, h);
  for (let x = 0; x <= w; x += 3) g.lineTo(x, waveY(x));
  g.lineTo(w, h); g.closePath();
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, `rgba(${P.sea[0]},0.8)`); gr.addColorStop(1, `rgba(${P.sea[1]},0.92)`);
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  // 물결 결 (흰 선을 겹겹이)
  for (let k = 1; k <= 5; k++) {
    const pts = []; for (let x = 0; x <= w; x += 6) pts.push([x, waveY(x) + k * 9]);
    brushOutline(g, pts, 1.1, r, false, `rgba(248,241,226,${0.42 - k * 0.05})`);
  }
  // 세이가이하
  g.strokeStyle = 'rgba(248,241,226,0.18)'; g.lineWidth = 1;
  const R = 13;
  for (let row = 0; row < 8; row++) for (let col = -1; col < w / (R * 2) + 1; col++) {
    const cx = col * R * 2 + (row % 2 ? R : 0), cy = h * 0.68 + row * R * 0.55;
    for (let k = 3; k >= 1; k--) { g.beginPath(); g.arc(cx, cy, R * k / 3, Math.PI, TAU); g.stroke(); }
  }
  g.restore();
  // 물마루 거품: 갈고리 같은 흰 손가락
  for (const cr of crests) {
    for (const ox of [-w, 0, w]) {
      const px = cr.x + ox, py = waveY(cr.x);
      for (let i = 0; i < 11; i++) {
        const a = -Math.PI * 0.9 + i * 0.16, d = 4 + i * 1.6;
        const fx = px + Math.cos(a) * d + i * 1.6, fy = py + 4 + Math.sin(a) * d * 0.6;
        paperPiece(g, polyPts([[fx, fy], [fx + 4 + r() * 3, fy + 3 + r() * 2], [fx + 1, fy + 5]], 1), PAL.washiLight, r, { amp: 0.4, rim: false, tex: 0 });
      }
      brushLine(g, [[px - cr.wid * 0.8, py + cr.ht * 0.5], [px - cr.wid * 0.3, py + 2], [px + 4, py - 2], [px + cr.wid * 0.35, py + 10]], 2, r, 'rgba(248,241,226,0.85)');
    }
  }
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, 0, 0, h * 0.45);
  fade.addColorStop(0, 'rgba(0,0,0,0.25)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = fade; g.fillRect(0, 0, w, h);
  return c;
}

// 색별 빛 번짐 스프라이트 (가산 합성용)
const glowCache = new Map();
function glowSprite(rgb) {

  if (!c) { c = makeGlow(64, `rgba(${rgb},1)`, `rgba(${rgb},0)`); glowCache.set(rgb, c); }

}
// 초롱 불빛 (번짐 원)
function makeGlow(size, inner, outer) {
  const c = makeCanvas(size, size), g = c.getContext('2d');

}

/* ---------- 2-7. 화면 오버레이: 와시 결(곱하기) + 누렇게 바랜 비네팅 ---------- */
function buildOverlay(w, h) {
  const c = makeCanvas(w, h), g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.save(); g.globalAlpha = 0.42; g.rotate(0.31); g.scale(1.7, 1.7);
  g.fillStyle = g.createPattern(colorTex, 'repeat'); g.fillRect(-w, -h, w * 2, h * 2);
  g.restore();
  const R = Math.hypot(w, h) / 2;
  const gr = g.createRadialGradient(w / 2, h / 2, R * 0.38, w / 2, h / 2, R * 1.02);
  gr.addColorStop(0, 'rgba(255,255,255,0)');
  gr.addColorStop(0.55, 'rgba(238,215,170,0.45)');
  gr.addColorStop(1, 'rgba(196,150,85,0.72)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = rng32(913);
  for (let i = 0; i < 70; i++) { // 가장자리 얼룩(세월 반점)
    const edge = r() * 4 | 0, t = r(), inset = Math.pow(r(), 2) * Math.min(w, h) * 0.18;
    const x = edge === 0 ? t * w : edge === 1 ? w - inset : edge === 2 ? t * w : inset;
    const y = edge === 0 ? inset : edge === 1 ? t * h : edge === 2 ? h - inset : t * h;
    const rr = 4 + r() * 26;
    const sg = g.createRadialGradient(x, y, 0, x, y, rr);
    sg.addColorStop(0, `rgba(165,115,55,${0.08 + r() * 0.14})`); sg.addColorStop(1, 'rgba(165,115,55,0)');
    g.fillStyle = sg; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  return c;
}

   3. 에셋 생성
   ===================================================================== */
/* =====================================================================
   2-9. 지역 그림: 소품 · 떨어지는 잎 · 바닥 장식 · 지역 요괴 · 대보스
   모두 원점 = 발밑 (요괴는 오른쪽을 봄)
   ===================================================================== */
function trunkPoly(g, r, sp, w0, col, taper = 0.65) {
  const L = [], R = [];
  for (let i = 0; i < sp.length; i++) {
    const t = i / (sp.length - 1), w = w0 * (1 - t * taper);
    const a = sp[Math.max(0, i - 1)], b = sp[Math.min(sp.length - 1, i + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
    L.push([sp[i][0] + nx * w, sp[i][1] + ny * w]); R.unshift([sp[i][0] - nx * w, sp[i][1] - ny * w]);
  }
  const tr = paperPiece(g, polyPts(L.concat(R), 2), col, r, { amp: 0.8 });
  brushOutline(g, tr, 1.1, r);
  return tr;
}
function limb(g, r, a, b, w, col) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), px = -Math.sin(ang) * w, py = Math.cos(ang) * w;
  outlined(g, [[a[0] + px, a[1] + py], [b[0] + px * 0.3, b[1] + py * 0.3], [b[0] - px * 0.3, b[1] - py * 0.3], [a[0] - px, a[1] - py]], col, r, 0.4, 0.7);
}
// 꽃구름 덩어리 (벚꽃 · 단풍 공용)
function blossomPads(g, r, pads, c1, c2, dots) {
  for (const [x, y, rx, ry] of pads) {
    const jx = x + (r() - 0.5) * 6, jy = y + (r() - 0.5) * 4;
    const pad = paperPiece(g, ellipsePts(jx, jy, rx, ry, 40), c1, r, { amp: 2.2 });
    g.save(); pathPts(g, pad); g.clip();
    paperPiece(g, ellipsePts(jx - rx * 0.15, jy - ry * 0.4, rx * 0.75, ry * 0.55, 30), c2, r, { amp: 1.4, rim: false });
    for (let k = 0; k < 14; k++) { g.fillStyle = dots[k % dots.length]; g.beginPath(); g.arc(jx + (r() - 0.5) * rx * 1.7, jy + (r() - 0.5) * ry * 1.6, 0.8 + r() * 1.3, 0, TAU); g.fill(); }
    g.restore();
    brushOutline(g, pad.filter(p => p[1] > jy - ry * 0.2), 0.8, r, false, 'rgba(90,40,40,0.45)');
  }
}

/* ---------- 떨어지는 잎 (지역마다 다른 '꽃잎') ---------- */
const FALL_STYLE = {
  bamboo: { f: '#9cb47c', b: '#bccb9a', vein: 'rgba(60,86,48,0.45)', pts: r => { const L = 9 + r() * 2, w = 2.2 + r() * 0.8; return [[0, L], [w * 0.7, L * 0.4], [w, 0], [w * 0.6, -L * 0.6], [0, -L], [-w * 0.6, -L * 0.6], [-w, 0], [-w * 0.7, L * 0.4]]; } },
  maple: { f: '#d9542f', b: '#eb9a52', vein: 'rgba(120,30,20,0.45)', pts: r => { const o = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * TAU, R = i % 2 ? 3.4 : 8.5 + r() * 1.5; o.push([Math.cos(a) * R, Math.sin(a) * R + 1]); } o.push([0.6, 9.5], [-0.6, 9.5]); return o; } },
  wisteria: { f: '#a990d6', b: '#cfc0ea', vein: 'rgba(80,60,130,0.35)', pts: r => { const s = 0.75 + r() * 0.2; return [[0, 6], [4.5, 3], [5.5, -2], [3, -6], [0, -5], [-3, -6], [-5.5, -2], [-4.5, 3]].map(([x, y]) => [x * s, y * s]); } },
  ash: { f: '#5a5250', b: '#8a807c', vein: 'rgba(255,120,60,0.55)', pts: r => { const o = []; for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, R = 4 + r() * 4; o.push([Math.cos(a) * R, Math.sin(a) * R * 0.8]); } return o; } },
};
function makeFallPair(r, kind) {
  const S = FALL_STYLE[kind], pts = S.pts(r).map(([x, y]) => [x + (r() - 0.5) * 0.8, y + (r() - 0.5) * 0.8]);
  const make = front => buildSprite(28, 28, 14, 14, g => {
    g.save(); g.translate(1.1, 1.5); g.fillStyle = 'rgba(70,50,40,0.16)'; pathPts(g, pts); g.fill(); g.restore();
    g.fillStyle = front ? S.f : S.b; pathPts(g, pts); g.fill();
    g.save(); pathPts(g, pts); g.clip(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.25; g.fillStyle = texPatternFor(g); g.fillRect(-14, -14, 28, 28); g.restore();
    g.strokeStyle = S.vein; g.lineWidth = 0.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 8); g.lineTo(0, -6); g.stroke();
    if (kind === 'maple') { g.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i / 5 * TAU; g.moveTo(0, 1); g.lineTo(Math.cos(a) * 6, Math.sin(a) * 6 + 1); } g.stroke(); }
    g.strokeStyle = 'rgba(255,250,245,0.55)'; g.lineWidth = 0.5; pathPts(g, pts); g.stroke();
  });
  const f = make(true), b = make(false);
  return { front: f.c, back: b.c, frontSoft: softened(f.c, 3), backSoft: softened(b.c, 3) };
}

/* ---------- 바닥 장식 스티커 ---------- */
function drawDecorArt(g, r, kind) {

// 슈텐도지: 흰 갈기 붉은 오니 왕 + 술 호리병 + 붉은 술잔

  paperPiece(g, polyPts([[3, -5], [10, -5], [11, 0.5], [2.5, 0.5]], 1.5), PAL.sumi, r, { amp: 0.5 });
  const gourd = paperPiece(g, [...ellipsePts(-15, -10, 4.5, 5.5, 14)], '#e8b84a', r, { amp: 0.3 });
  brushOutline(g, gourd, 0.7, r); paperPiece(g, ellipsePts(-15, -18, 3, 3.4, 12), '#e8b84a', r, { amp: 0.2 }); brushLine(g, [[-18, -14], [-12, -14]], 1, r, PAL.shu);
  const body = paperPiece(g, ellipsePts(0, -19, 15, 15, 40), '#b8301f', r, { amp: 1.3 });
  brushOutline(g, body, 1.5, r);
  for (const s of [-1, 1]) { const h = paperPiece(g, polyPts([[s * 4, -32], [s * 9, -44], [s * 11, -42], [s * 9, -31]], 1.2), '#f2e6c8', r, { amp: 0.3 }); brushOutline(g, h, 0.8, r); }
  paperPiece(g, polyPts([[-12, -10], [12, -10], [10, -4], [-10, -4]], 1.5), '#2b2b30', r, { amp: 0.4 });
  for (let k = -2; k <= 2; k++) paperPiece(g, ellipsePts(k * 4.5, -7, 1.4, 1.4, 8), PAL.odo, r, { amp: 0.1, rim: false });
  for (const s of [-1, 1]) { paperPiece(g, ellipsePts(s * 5.5, -22, 3.6, 3.2, 12), '#f8e8a0', r, { amp: 0.25, rim: false }); g.fillStyle = PAL.sumi; g.beginPath(); g.arc(s * 5.5 + 0.8, -21.7, 1.6, 0, TAU); g.fill(); brushLine(g, [[s * 10, -27], [s * 3, -25]], 1.8, r); }
  brushLine(g, [[-6, -14], [0, -12.5], [6, -14]], 1.3, r);
  g.fillStyle = PAL.washiLight; pathPts(g, [[-4.6, -13.6], [-3.2, -10.4], [-2, -13]]); g.fill(); pathPts(g, [[4.6, -13.6], [3.2, -10.4], [2, -13]]); g.fill();

}

function applyCharm(e, t) { if (e.dead) return; e.charmT = Math.max(e.charmT || 0, e.boss ? Math.min(0.4, t) : t); if (S.syn.chikurin && !e.boss && Math.random() < 0.5) zones.push({ kind: 'spike', x: e.x, y: e.y, t: 0, r: 26, dmg: wStatOf('takeyari', 18), life: 1, max: 1, tick: 99, hit: false, src: 'takeyari' }); }
function wStatOf(id, fb) { const w = build.weapons.find(q => q.id === id); return w ? wStat(w).dmg : fb; }
const throwArc = (kind, tx, ty, dur, o) => { if (shots.length >= BAL.SHOT_MAX) return null; fireProj(kind, player.x, player.y - 20, 0, 0, Object.assign({ life: dur + 0.05, speed: 1, pierce: 99 }, o)); const s = shots[shots.length - 1]; s.fx0 = player.x; s.fy0 = player.y; s.tx = tx; s.ty = ty; s.arcT = 0; s.arcD = dur; return s; };
function arcStep(s, dt, H = 60) { s.arcT += dt; const p = Math.min(1, s.arcT / s.arcD); s.x = lerp(s.fx0, s.tx, p); s.y = lerp(s.fy0, s.ty, p); s.z = Math.sin(Math.PI * p) * H; s.wob += dt * 10; return p >= 1; }

/* ---------- 발동 (FIRE) · 상시 (CONT) ---------- */
Object.assign(FIRE, {
  sakura(w, s) {
    if (!nearestEnemy(player.x, player.y, s.r + 60)) return false;
    w.rot = (w.rot || 0) + 0.7;

    for (let k = 0; k < spirals; k++) for (let i = 0; i < s.petals; i++) {
      fireProj('petal', player.x, player.y - 16, 0, 0, { dmg: s.dmg, pierce: 99, life: 1.15, speed: 1, r: 10 });
      const p = shots[shots.length - 1]; if (!p) break;
      p.a0 = w.rot + i / s.petals * TAU + k * 0.4; p.dir = k ? -1 : 1; p.R = s.r; p.bloom = w.ev >= 2; p.pv = (i + k) % 6;
    }
    if (w.ev >= 3) { w.sk = (w.sk || 0) + 1; if (w.sk % 3 === 0) { zones.push({ kind: 'storm', x: player.x, y: player.y, t: 0, dur: 1.5, dir: wind.x >= 0 ? 1 : -1, h: 280, dmg: s.dmg * 3.2, hit: new Set(), life: 1.7, max: 1.7, tick: 99 }); screenFlash('255,220,230', 0.25); SFX.play('chime'); } }
    SFX.play('swing');
  },
  temari(w, s) {
    const t = nearestEnemy(player.x, player.y, 330); if (!t) return false;
    const [dx, dy] = aimAt(t);
    fireProj('temari', player.x, player.y - 14, dx, dy, { dmg: s.dmg, pierce: 999, life: 5, speed: 430, r: w.ev >= 1 ? 13 : 9 });
    const b = shots[shots.length - 1]; if (b) { b.target = t; b.bounces = s.bounce + (w.ev >= 1 ? 2 : 0); b.mult = 1; b.split = w.ev >= 2; b.big = w.ev >= 1; b.recent = []; }
    if (w.ev >= 3 && !shots.some(q => q.kind === 'gtemari')) { fireProj('gtemari', player.x, player.y, 0, 0, { dmg: s.dmg * 0.9, pierce: 999, life: 4.5, speed: 1, r: 30 }); const g = shots[shots.length - 1]; if (g) { g.hitCd = new Map(); g.ang = rand(0, TAU); } }
    SFX.play('hop', 2);
  },
  takeyari(w, s) {
    const t = nearestEnemy(player.x, player.y, 360); if (!t) return false;
    const a = Math.atan2(t.y - player.y, t.x - player.x), lines = w.ev >= 1 ? [a - 0.42, a, a + 0.42] : [a];
    for (const b of lines) for (let k = 0; k < s.len; k++) zones.push({ kind: 'spike', x: player.x + Math.cos(b) * (30 + k * 30), y: player.y + Math.sin(b) * (30 + k * 30) * 0.8, t: -k * 0.045, r: 28, dmg: s.dmg, life: 1, max: 1, tick: 99, hit: false, grove: w.ev >= 2 && k === s.len - 1, seed: Math.random() });
    if (w.ev >= 3) for (const [R, n, d] of [[70, 10, 0.1], [130, 16, 0.32]]) for (let k = 0; k < n; k++) { const b = k / n * TAU; zones.push({ kind: 'spike', x: player.x + Math.cos(b) * R, y: player.y + Math.sin(b) * R * 0.75, t: -d, r: 26, dmg: s.dmg * 1.5, life: 1, max: 1, tick: 99, hit: false, seed: Math.random() }); }
    SFX.play('big');
  },
  shakuhachi(w, s) {
    const ts = nearestN(player.x, player.y, 360, s.notes + (w.ev >= 1 ? 2 : 0)); if (!ts.length) return false;
    const n = s.notes + (w.ev >= 1 ? 2 : 0);
    for (let i = 0; i < n; i++) { const t = ts[i % ts.length], [dx, dy] = aimAt(t); after(i * 0.07, () => { fireProj('note', player.x, player.y - 26, dx, dy, { dmg: s.dmg, pierce: 0, life: 2.2, speed: 240, r: 10 }); const q = shots[shots.length - 1]; if (q) { q.target = t; q.charm = w.ev >= 1 ? 1.6 : 1.2; q.wa = rand(0, TAU); } }); }
    if (w.ev >= 2) {
      w.nc = (w.nc || 0) + 1;
      if (w.nc % 3 === 0) {
        zones.push({ kind: 'chord', x: player.x, y: player.y, t: 0, dur: 0.55, R: w.ev >= 3 ? 220 : 170, hit: new Set(), dmg: s.dmg * (w.ev >= 3 ? 2.6 : 2), life: 0.8, max: 0.8, tick: 99 });
        if (w.ev >= 3 && w.nc % 6 === 0) { // 코다마의 노래: 화면의 요괴가 모두 춤춘다
          for (const e of onScreenEnemies()) { e.stunT = Math.max(e.stunT, e.boss ? 0.4 : 1.4); e.danceT = 3; dealDamage(e, s.dmg * 3, 0, 0, 0, { small: true, quiet: true }); }
          addFx({ type: 'kodamasong', x: player.x, y: player.y, life: 1.4, lv: 1 }); screenFlash('210,255,200', 0.25);

  omikuji(w, s) {

    for (let i = 0; i < n; i++) { const e = near[(i * 3) % near.length]; const k = throwArc('kuji', e.x + rand(-10, 10), e.y + rand(-8, 8), 0.55, { dmg: s.dmg, r: 8 }); if (k) { k.R = s.r; k.ev = w.ev; k.wref = w; } }
    SFX.play('card');
  },
  torii(w, s) {

    d.x += d.vx * dt; d.y += d.vy * dt;

  for (const id in BLESS) if (!build.bless.has(id)) pool.push({ kind: 'bless', id, w: legend ? 1.5 : 0.06, legend: true });
  if (wave.n >= HIDEN_FROM) for (const id in HIDEN) if (!build.hiden.has(id)) pool.push({ kind: 'hiden', id, w: legend ? 1.3 : 0.3, legend: true });
  for (const e of pool) { const d = (e.kind === 'wnew' && WEAP[e.id]) || (e.kind === 'pnew' && PASS[e.id]); if (d && d.region === RUN.ch && !RUN.shura) e.w *= 1.6; } // 그 지역의 카드가 더 잘 나온다
  for (const e of pool) { // 고른 혈통·모으는 속성 쪽 카드가 더 잘 나온다
    const tags = tagsOf(e.kind, e.id);

    if (e.kind !== 'pnew' && e.kind !== 'wnew') continue;
    for (const w of build.weapons) { const E = WEAP[w.id].evos[2]; if (E.pas === e.id && w.ev < 3) e.w *= 1 + w.lv * 0.6 + w.ev * 0.8; }
    for (const k in SYN) if (!build.syn.has(k)) { const N = SYN[k].need, mine = n => (Array.isArray(n) ? n : [n]).includes(e.id), other = n => (Array.isArray(n) ? n : [n]).some(synHas); if ((mine(N[0]) && other(N[1])) || (mine(N[1]) && other(N[0]))) e.w *= 1.6; }

}

function applyCard(c) {

function frame(now) { // 세상 기준 크기로 갱신하고 그린다

  try { frameInner(now); } finally { worldOff(); }
}
function frameInner(now) {
  if (meta.settings.fps30 && now - fpsLast < 30) { requestAnimationFrame(frame); return; } // 절전: 30프레임
  fpsLast = now;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  perfTick(dt); pauseTick(dt); wakeTick();
  if (hitstop > 0 && (state === 'play' || state === 'dying')) { hitstop -= dt; render(); requestAnimationFrame(frame); return; }
  if (state !== 'pause') {
    ambT += dt;
    updateWind(dt);
    collectProps(); updateAmbient(dt);
    if (execFx && !execFx.done && state === 'play') { // 처형하는 동안 세상이 멈춘다

      render(); requestAnimationFrame(frame); return;
    }
    if (ultFx && !ultFx.struck && state === 'play') { // 오의 컷인 동안 세상이 멈춘다
      ultFx.t += dt; if (ultFx.t >= ACT.ULT_CUT) ultStrike();
      render(); requestAnimationFrame(frame); return;
    }
    if (state === 'title') {
      menu.t += dt; updateTitleFx(dt);
      player.x += 22 * dt; player.y += Math.sin(ambT * 0.2) * 6 * dt; // 배경이 천천히 흘러감
    } else if (state === 'play') {
      const rdt = dt; let wd = dt;
      if (slowmo > 0) { slowmo -= rdt; wd = dt * SOUL.SLOWK; } // 튕겨내기 직후 세상이 느려진다
      time += wd; hintT += rdt; coachTick(rdt);
      updatePlayer(wd);
      updateEnemies(wd);
      resolvePropCollisions();
      updateWeapons(wd);
      updateShots(wd);
      updateZones(wd);
      updateWarns(wd);
      updateHazard(wd); updateEhaz(wd);
      if (state === 'play') damagePlayer();
      updateDrops(wd);
      updateExtras(wd); updateGuard(rdt);
      for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) { enemyPool.push(enemies[i]); enemies[i] = enemies[enemies.length - 1]; enemies.pop(); }
      buildGrid(); // 정리 뒤 격자를 다시 맞춘다 (불타 죽는 적의 폭발이 다음 프레임 초반에 격자를 쓴다)
      if (state === 'play') updateWave(dt);
      checkPendingCards();
      if (state === 'play') updateForm(true);
    } else if (state === 'cards') {
      updateCards(dt);
    } else if (state === 'dying') {

    } else if (state === 'over' || state === 'win') overT += dt;
    if (state === 'win' && !tearSnap) { render(); snapTear(); overT = 0; }
    updateFx(dt);
    flash.a = Math.max(0, flash.a - dt * 2.6);
    updateParticles(dt);
    updateDecals(dt);
    updateCamera(dt);
    updatePetals(dt);
    for (let i = ui.marks.length - 1; i >= 0; i--) { ui.marks[i].t += dt; if (ui.marks[i].t > 3) ui.marks.splice(i, 1); }
  }
  render();
  requestAnimationFrame(frame);
}

const toSX = x => x - renderCX + W / 2;

function drawGround() {

  }
  for (const d of decals) {

    ctx.globalAlpha = Math.min(1, d.life / 2) * 0.9;
    drawImg(d.spr.c, d.spr.w, d.spr.h, d.spr.ox, d.spr.oy, x, y, d.rot, d.scale, d.scale * 0.8);

// 초롱 · 석등 불빛: 은은하게 깜빡임
function drawGlows() {

  ctx.globalCompositeOperation = 'lighter';

// 바닥 공격: 소용돌이, 갈라진 땅, 결계, 번개 구름, 퍼지는 고리

      ctx.globalAlpha = 0.18 * a; ctx.fillStyle = 'rgb(150,120,230)'; ctx.beginPath(); ctx.ellipse(x, y, z.r, z.r * 0.6, 0, 0, TAU); ctx.fill();

        if (!z.small) for (let k = 0; k < 6; k++) { // 흩날리는 단자쿠 종이

  }

}

/* ---------- 새 공격 연출 (drawFx에서 불린다) ---------- */
function drawFx11(f, t, x, y, a, big) {
  switch (f.type) {
    case 'whirl': { // 폭풍검: 한 바퀴 도는 바람 칼날

      ctx.beginPath(); ctx.ellipse(x, y, f.r * 0.9, f.r * 0.9 * 0.75, 0, a0, a0 + TAU * sw); ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = a * 0.85; ctx.fillStyle = PAL.sumi;
      ctx.beginPath(); ctx.ellipse(x, y, f.r, f.r * 0.75, 0, a0, a0 + TAU * sw); ctx.ellipse(x, y, f.r * 0.7, f.r * 0.52, 0, a0 + TAU * sw, a0, true); ctx.closePath(); ctx.fill();

      ctx.lineCap = 'round';

      for (let i = 0; i < N; i++) { const k = i / (N - 1); pts.push([x + Math.sin(k * 7 + t * 8) * f.r * 0.5 * (1 - k * 0.4), y - k * H0]); }

      const r = rng32(((f.seed * 1000) | 0) + Math.floor(t * 20));
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.strokeStyle = 'rgb(200,180,255)'; ctx.lineWidth = 2;
      if (f.type === 'zonezap') { for (let k = 0; k < 6; k++) { const a0 = r() * TAU; ctx.beginPath(); ctx.moveTo(x, y); for (let j = 1; j <= 4; j++) { const L = f.r * j / 4; ctx.lineTo(x + Math.cos(a0 + (r() - 0.5) * 0.9) * L, y + Math.sin(a0 + (r() - 0.5) * 0.9) * L * 0.6); } ctx.stroke(); } }
      else { const x2 = toSX(f.x2), y2 = toSY(f.y2); ctx.beginPath(); ctx.moveTo(x, y); for (let j = 1; j <= 8; j++) { const k = j / 8; ctx.lineTo(x + (x2 - x) * k + (r() - 0.5) * 12, y + (y2 - y) * k + (r() - 0.5) * 12); } ctx.stroke(); }

    }

        ctx.globalAlpha = a; ctx.strokeStyle = '#f8f2e4'; ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + cx * L * 0.5 - cy * wv, y + cy * L * 0.5 + cx * wv, ex, ey); ctx.stroke();

        drawImg(hd.c, hd.w, hd.h, hd.ox, hd.oy, ex, ey, cx < 0 ? b + Math.PI : b, cx < 0 ? -1.1 : 1.1, 1.1); ctx.setTransform(D, 0, 0, D, 0, 0);
