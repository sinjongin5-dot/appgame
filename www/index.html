// 런이 끝나면 금박 정산 + 별 · 도감 · 의뢰 (한 번만)
function finishRun(win) {

  const starMul = 1 + countStars() * 0.02, comboMul = 1 + Math.min(0.2, run.bestCombo / 1500);
  const base = (kills * G.PER_KILL + waves * G.PER_WAVE + prog.elites * G.PER_ELITE + (win ? G.WIN : 0)) * RUN.gold;
  prog.goldBase = Math.round(base); prog.goldCoin = Math.round(run.coinGold);

  }

  prog.newBest = wave.n > b.wave || (wave.n === b.wave && time > b.time);
  if (prog.newBest) { b.wave = wave.n; b.time = Math.round(time); }
  b.kills = Math.max(b.kills, kills); b.combo = Math.max(b.combo || 0, run.bestCombo);
  if (win) b.wins = (b.wins || 0) + 1;

  if (!RUN.shura) {
    const st = J.stars[RUN.ch] || [0, 0, 0];
    const got = [win, run.bestCombo >= STAR_COMBO(RUN.ch), win && player.hp >= player.maxHp * 0.5];
    got.forEach((g, i) => { if (g && !st[i]) { st[i] = 1; prog.newStars++; } });
    J.stars[RUN.ch] = st;
    if (win && RUN.ch + 1 > J.cleared) { J.cleared = RUN.ch + 1; J.sel = J.cleared; prog.unlocked = RUN.ch + 1 < 5 ? CHAPTERS[RUN.ch + 1].name : '수라의 길'; }
  } else if (win && RUN.shura > J.shura) { J.shura = RUN.shura; J.shuraSel = J.shura + 1; prog.unlocked = `수라 ${RUN.shura + 1}단`; }

  prog.dexUp = 0; prog.dexGold = 0;
  for (const d of DEX) {
    const lv = dexLevel(d), had = meta.dexLv[d.k] || 0;

// 타일링 가능한 값 노이즈 (fbm)
function tileNoise(size, seed) {
  const out = new Float32Array(size * size);

  let tot = 0;
  for (let o = 0; o < periods.length; o++) {
    const P = periods[o], A = amps[o], cell = size / P, r = rng32(seed + o * 101);
    const lat = new Float32Array(P * P);

        const a = lat[y0 * P + x0], b = lat[y0 * P + x1], c = lat[y1 * P + x0], d = lat[y1 * P + x1];
        out[y * size + x] += A * ((a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty);
      }
    }
    tot += A;
  }
  for (let i = 0; i < out.length; i++) out[i] /= tot;

// 섬유 한 가닥 (타일 경계에서 반대편으로 이어지게 9방향 반복)

  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;

    g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(mx + ox, my + oy, ex + ox, ey + oy); g.stroke();

}

// 바닥 와시 타일: 미색 + 얼룩진 구름 무늬 + 섬유 결 + 나무껍질 티

// 색지 표면용 중성 텍스처 (곱하기로 얹음)
function makeColorTex(size, seed) {
  const c = makeCanvas(size, size), g = c.getContext('2d');

// 찢어진 가장자리: 윤곽 법선 방향으로 저/고주파 노이즈 + 가끔 뜯긴 홈
function tornPoly(base, r, amp, fine, grow = 0) {

// 붓선: 구간마다 굵기·농도가 달라지는 먹선

function stickerize(spr, white = 2.2, dark = 3) {
  const res = spr.res || SPR, pad = 4;

  for (let k = 0; k < 16; k++) { const a = k / 16 * TAU; g.drawImage(darkSil, (pad + Math.cos(a) * dark) * res, (pad + Math.sin(a) * dark) * res); }
  for (let k = 0; k < 16; k++) { const a = k / 16 * TAU; g.drawImage(whiteSil, (pad + Math.cos(a) * white) * res, (pad + Math.sin(a) * white) * res); }

// 처치 시 찢어지는 조각: 중심에서 뻗은 지그재그 찢김선으로 분할
function makeFragments(spr, cx, cy, r, count) {
  const R = Math.max(spr.w, spr.h);
  const base = r() * TAU, angs = [];
  for (let i = 0; i < count; i++) angs.push(base + i * TAU / count + (r() - 0.5) * (TAU / count) * 0.45);
  const center = [cx + (r() - 0.5) * 3, cy + (r() - 0.5) * 3];
  const rays = angs.map(a => {
    const pts = [];
    for (let k = 1; k <= 7; k++) {
      const rr = k / 7 * R, perp = (r() - 0.5) * 5;
      pts.push([center[0] + Math.cos(a) * rr - Math.sin(a) * perp, center[1] + Math.sin(a) * rr + Math.cos(a) * perp]);
    }
    return pts;
  });
  const frags = [];
  for (let i = 0; i < count; i++) {
    const a0 = angs[i], a1 = angs[(i + 1) % count];
    let da = a1 - a0; while (da <= 0) da += TAU;
    const poly = [center, ...rays[i]];
    for (let k = 1; k < 4; k++) { const a = a0 + da * k / 4; poly.push([center[0] + Math.cos(a) * R * 1.3, center[1] + Math.sin(a) * R * 1.3]); }
    poly.push(...rays[(i + 1) % count].slice().reverse());
    const c = makeCanvas(spr.c.width, spr.c.height), g = c.getContext('2d');
    g.scale(spr.res || SPR, spr.res || SPR);
    g.save(); pathPts(g, poly); g.clip(); g.drawImage(spr.c, 0, 0, spr.w, spr.h); g.restore();
    g.globalCompositeOperation = 'source-atop';
    g.strokeStyle = 'rgba(251,246,234,0.95)'; g.lineWidth = 1.5; g.lineJoin = 'round';
    for (const ray of [rays[i], rays[(i + 1) % count]]) {
      g.beginPath(); g.moveTo(center[0], center[1]); for (const p of ray) g.lineTo(p[0], p[1]); g.stroke();
    }
    const am = a0 + da / 2;
    frags.push({
      c, back: silhouette(c, '#ebdfc6'),
      px: center[0] + Math.cos(am) * 7, py: center[1] + Math.sin(am) * 7, // 회전 중심(스프라이트 좌표)
      ang: am,
    });
  }
  return frags;
}

function petalPts(r) {

  // 가위로 자른 듯: 꼭짓점만 흔들고 직선으로 잇는다
  return B.map(([x, y]) => [x * ws + (r() - 0.5) * 1.2, y * ls + (r() - 0.5) * 1.2]);
}

    g.fillStyle = gr; g.fillRect(-14, -14, 28, 28);

    g.beginPath(); g.moveTo(0, 8); g.lineTo(0, -4.5); g.moveTo(0, 5); g.lineTo(-2.8, -5.2); g.moveTo(0, 5); g.lineTo(2.8, -5.2); g.stroke();

function makeBrushBar(w, h, color, seed, dry) {

    for (let i = 0; i <= N; i++) {

      let th = h * (0.78 + 0.22 * Math.sin(t * 7 + 1) * 0.6 + (r() - 0.5) * 0.12);
      if (t < 0.04) th *= 0.75 + t * 6;

function wrapLines(g, text, maxW) {
  const out = []; let cur = '';
  for (const word of String(text).split(' ')) {
    const test = cur ? cur + ' ' + word : word;
    if (g.measureText(test).width <= maxW) { cur = test; continue; }
    if (cur) out.push(cur);
    if (g.measureText(word).width > maxW) {
      let part = '';
      for (const ch of word) { if (g.measureText(part + ch).width > maxW) { out.push(part); part = ch; } else part += ch; }
      cur = part;
    } else cur = word;
  }
  if (cur) out.push(cur);
  return out;
}

// 대나무 무리
function drawBambooArt(g, r) {
  const n = 3 + ((r() * 3) | 0), culms = [];
  for (let i = 0; i < n; i++) culms.push({ x: (r() - 0.5) * 34, h: 100 + r() * 40, w: 4.2 + r() * 2, lean: (r() - 0.5) * 0.12 });
  culms.sort((a, b) => b.h - a.h);
  const blade = (ax, ay, ang, L, w, col) => {
    const c = Math.cos(ang), s = Math.sin(ang);
    const pts = [[0, 0], [L * 0.3, -w / 2], [L, 0], [L * 0.3, w / 2]].map(([x, y]) => [ax + x * c - y * s, ay + x * s + y * c]);
    paperPiece(g, polyPts(pts, 1.5), col, r, { amp: 0.25, tex: 0.35 });
  };
  for (const c of culms) {
    const tx = c.x + c.lean * c.h;
    const body = paperPiece(g, polyPts([[c.x - c.w / 2, 0], [c.x + c.w / 2, 0], [tx + c.w * 0.35, -c.h], [tx - c.w * 0.35, -c.h]], 2), r() < 0.5 ? PAL.bamboo : PAL.bambooL, r, { amp: 0.45 });
    brushOutline(g, body, 0.7, r, true, 'rgba(40,58,34,0.8)');
    for (let y = -14 - r() * 4; y > -c.h + 8; y -= 15 + r() * 5) {
      const x = c.x + c.lean * -y, ww = c.w * (1 - (-y / c.h) * 0.3);
      brushLine(g, [[x - ww / 2 - 0.8, y], [x + ww / 2 + 0.8, y]], 1, r, 'rgba(40,58,34,0.75)');
      brushLine(g, [[x - ww / 2 + 0.5, y - 1.4], [x + ww / 2 - 0.5, y - 1.4]], 0.5, r, 'rgba(248,241,226,0.55)');
    }
    const sprays = 3 + ((r() * 3) | 0);
    for (let k = 0; k < sprays; k++) {
      const t = 0.5 + r() * 0.5, ay = -c.h * t, ax = c.x + c.lean * c.h * t, side = r() < 0.5 ? -1 : 1;
      for (let b = 0; b < 3 + ((r() * 2) | 0); b++) {
        const ang = side > 0 ? 0.25 + r() * 0.9 : Math.PI - 0.25 - r() * 0.9;
        blade(ax, ay, ang, 11 + r() * 9, 2.6 + r() * 1.2, r() < 0.6 ? PAL.bambooD : PAL.bamboo);
      }
    }
  }
}

// 소나무
function drawPineArt(g, r) {

    outlined(g, [[a[0] + px, a[1] + py], [b[0] + px * 0.3, b[1] + py * 0.3], [b[0] - px * 0.3, b[1] - py * 0.3], [a[0] - px, a[1] - py]], PAL.bark, r, 0.4, 0.7);
  };

      brushLine(g, [[px, py], [px + (r() - 0.5) * 3, py - 3 - r() * 2]], 0.6, r, 'rgba(26,26,26,0.45)');

  }
}

// 연못 충돌: 타원 물 영역, 단 다리 폭(가운데 세로 띠)은 지나갈 수 있다
const POND_BRIDGE_HALF = 15;
function pushOutOfPond(o, cx, cy, rad) {
  const dx = o.x - cx, dy = o.y - cy;
  if (Math.abs(dx) < POND_BRIDGE_HALF) return;
  const rx = POND_RX + rad * 0.4, ry = POND_RY + rad * 0.4;
  const q = (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry);
  if (q >= 1) return;
  const s = 1 / Math.sqrt(Math.max(q, 1e-6));
  const bx = dx * s, by = dy * s, dEdge = Math.hypot(bx - dx, by - dy);
  const dBridge = Math.abs(dx) - POND_BRIDGE_HALF + 1;
  if (dBridge < dEdge && Math.abs(dy) < POND_RY + 30) o.x = cx + Math.sign(dx) * (POND_BRIDGE_HALF - 1);
  else { o.x = cx + bx; o.y = cy + by; }
}

/* ---------- 2-6. 우키요에풍 먼 산 · 파도 띠 (가로로 이어지는 타일) ---------- */
function periodic(x, w, harm) { let s = 0; for (const [k, a, ph] of harm) s += a * Math.sin(TAU * k * x / w + ph); return s; }
function harmonics(r, ks, base) { return ks.map((k, i) => [k, base * Math.pow(0.68, i), r() * TAU]); }
function wrapDx(x, c, w) { return ((x - c) % w + w * 1.5) % w - w / 2; }

function makeMountainBand(w, h, seed) {
  const r = rng32(seed), c = makeCanvas(w, h), g = c.getContext('2d');
  const hf = harmonics(r, [1, 2, 3, 5, 9, 17], 0.5), hn = harmonics(r, [2, 3, 4, 7, 13, 23], 0.45);
  const peakX = w * 0.32;
  const farY = x => {
    const f = Math.max(0, 1 - Math.abs(wrapDx(x, peakX, w)) / (w * 0.13));
    return h * 0.56 + h * 0.16 * periodic(x, w, hf) - h * 0.4 * Math.pow(f, 1.6);
  };
  const nearY = x => h * 0.8 + h * 0.08 * periodic(x, w, hn);
  const fillRange = (fy, top, bot) => {
    g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 4) g.lineTo(x, fy(x));
    g.lineTo(w, h); g.closePath();
    const gr = g.createLinearGradient(0, h * 0.1, 0, h);
    gr.addColorStop(0, top); gr.addColorStop(1, bot);
    g.fillStyle = gr; g.fill();
  };
  // 먼 산: 위가 진하고 아래로 옅어지는 보카시
  fillRange(farY, 'rgba(43,74,111,0.62)', 'rgba(43,74,111,0.04)');
  // 눈 덮인 봉우리
  g.save();
  g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 4) g.lineTo(x, farY(x)); g.lineTo(w, h); g.closePath(); g.clip();
  g.beginPath(); g.moveTo(0, 0);
  for (let x = 0; x <= w; x += 6) g.lineTo(x, h * 0.25 + Math.sin(x * 0.09) * 6 + Math.sin(x * 0.23 + 1) * 4 + (r() - 0.5) * 3);
  g.lineTo(w, 0); g.closePath(); g.fillStyle = 'rgba(248,241,226,0.94)'; g.fill();
  g.restore();
  const ridge = []; for (let x = 0; x <= w; x += 6) ridge.push([x, farY(x)]);
  brushOutline(g, ridge, 1.4, r, false, 'rgba(26,26,26,0.35)');
  // 가까운 언덕 + 작은 솔
  fillRange(nearY, 'rgba(28,42,58,0.55)', 'rgba(28,42,58,0.06)');
  g.fillStyle = 'rgba(26,26,26,0.4)';
  for (let x = 10; x < w; x += 22 + r() * 40) {
    const y = nearY(x), s = 5 + r() * 6;
    g.beginPath(); g.moveTo(x, y - s * 1.6); g.lineTo(x + s * 0.7, y + 1); g.lineTo(x - s * 0.7, y + 1); g.fill();
  }
  // 가스미 (안개 띠): 종이를 길게 찢은 모양
  for (const [yy, n] of [[0.62, 2], [0.74, 2], [0.44, 1]]) {
    for (let i = 0; i < n; i++) {
      const L = w * (0.22 + r() * 0.2), x0 = r() * w, y0 = h * yy + (r() - 0.5) * 10, th = 8 + r() * 6;
      const base = polyPts([[0, 0], [L, 0], [L + th, th / 2], [L, th], [0, th], [-th, th / 2]], 4);
      for (const ox of [-w, 0, w]) {
        const pts = tornPoly(base.map(([x, y]) => [x + x0 + ox, y + y0]), r, 1.4, 0.6);
        g.fillStyle = 'rgba(248,241,226,0.92)'; pathPts(g, pts); g.fill();
        g.strokeStyle = 'rgba(201,162,74,0.35)'; g.lineWidth = 0.8; g.stroke();
      }
    }
  }
  // 학 무리
  g.strokeStyle = 'rgba(26,26,26,0.55)'; g.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const x = w * 0.6 + i * 16 + (r() - 0.5) * 10, y = h * 0.18 + i * 5 + (r() - 0.5) * 6, s = 3 + r() * 2;
    g.lineWidth = 1.1; g.beginPath(); g.moveTo(x - s, y - s * 0.5); g.quadraticCurveTo(x - s * 0.3, y, x, y + 0.5); g.quadraticCurveTo(x + s * 0.3, y, x + s, y - s * 0.6); g.stroke();
  }
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, h * 0.55, 0, h);
  fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fade; g.fillRect(0, 0, w, h);
  return c;
}

function makeWaveBand(w, h, seed) {
  const r = rng32(seed), c = makeCanvas(w, h), g = c.getContext('2d');
  const hs = harmonics(r, [3, 5, 8, 13], 0.5);
  const crests = [0.1, 0.36, 0.63, 0.86].map(t => ({ x: w * t + (r() - 0.5) * 40, ht: h * (0.3 + r() * 0.18), wid: w * (0.06 + r() * 0.04) }));
  const waveY = x => {
    let y = h * 0.5 + h * 0.05 * periodic(x, w, hs);
    for (const cr of crests) {
      const dx = wrapDx(x, cr.x, w);
      const t = dx < 0 ? -dx / (cr.wid * 1.8) : dx / (cr.wid * 0.45);
      if (t < 1) y -= cr.ht * Math.pow(1 - t * t, dx < 0 ? 1.2 : 0.7);
    }
    return y;
  };
  g.beginPath(); g.moveTo(0, h);
  for (let x = 0; x <= w; x += 3) g.lineTo(x, waveY(x));
  g.lineTo(w, h); g.closePath();
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, 'rgba(43,74,111,0.8)'); gr.addColorStop(1, 'rgba(24,42,66,0.92)');
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  // 물결 결 (흰 선을 겹겹이)
  for (let k = 1; k <= 5; k++) {
    const pts = []; for (let x = 0; x <= w; x += 6) pts.push([x, waveY(x) + k * 9]);
    brushOutline(g, pts, 1.1, r, false, `rgba(248,241,226,${0.42 - k * 0.05})`);
  }
  // 세이가이하
  g.strokeStyle = 'rgba(248,241,226,0.18)'; g.lineWidth = 1;
  const R = 13;
  for (let row = 0; row < 8; row++) for (let col = -1; col < w / (R * 2) + 1; col++) {
    const cx = col * R * 2 + (row % 2 ? R : 0), cy = h * 0.68 + row * R * 0.55;
    for (let k = 3; k >= 1; k--) { g.beginPath(); g.arc(cx, cy, R * k / 3, Math.PI, TAU); g.stroke(); }
  }
  g.restore();
  // 물마루 거품: 갈고리 같은 흰 손가락
  for (const cr of crests) {
    for (const ox of [-w, 0, w]) {
      const px = cr.x + ox, py = waveY(cr.x);
      for (let i = 0; i < 11; i++) {
        const a = -Math.PI * 0.9 + i * 0.16, d = 4 + i * 1.6;
        const fx = px + Math.cos(a) * d + i * 1.6, fy = py + 4 + Math.sin(a) * d * 0.6;
        paperPiece(g, polyPts([[fx, fy], [fx + 4 + r() * 3, fy + 3 + r() * 2], [fx + 1, fy + 5]], 1), PAL.washiLight, r, { amp: 0.4, rim: false, tex: 0 });
      }
      brushLine(g, [[px - cr.wid * 0.8, py + cr.ht * 0.5], [px - cr.wid * 0.3, py + 2], [px + 4, py - 2], [px + cr.wid * 0.35, py + 10]], 2, r, 'rgba(248,241,226,0.85)');
    }
  }
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, 0, 0, h * 0.45);
  fade.addColorStop(0, 'rgba(0,0,0,0.25)'); fade.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = fade; g.fillRect(0, 0, w, h);
  return c;
}

// 색별 빛 번짐 스프라이트 (가산 합성용)
const glowCache = new Map();
function glowSprite(rgb) {
  let c = glowCache.get(rgb);
  if (!c) { c = makeGlow(64, `rgba(${rgb},1)`, `rgba(${rgb},0)`); glowCache.set(rgb, c); }
  return c;
}
// 초롱 불빛 (번짐 원)
function makeGlow(size, inner, outer) {
  const c = makeCanvas(size, size), g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}

/* ---------- 2-7. 화면 오버레이: 와시 결(곱하기) + 누렇게 바랜 비네팅 ---------- */
function buildOverlay(w, h) {
  const c = makeCanvas(w, h), g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.save(); g.globalAlpha = 0.42; g.rotate(0.31); g.scale(1.7, 1.7);
  g.fillStyle = g.createPattern(colorTex, 'repeat'); g.fillRect(-w, -h, w * 2, h * 2);
  g.restore();
  const R = Math.hypot(w, h) / 2;
  const gr = g.createRadialGradient(w / 2, h / 2, R * 0.38, w / 2, h / 2, R * 1.02);
  gr.addColorStop(0, 'rgba(255,255,255,0)');
  gr.addColorStop(0.55, 'rgba(238,215,170,0.45)');
  gr.addColorStop(1, 'rgba(196,150,85,0.72)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const r = rng32(913);
  for (let i = 0; i < 70; i++) { // 가장자리 얼룩(세월 반점)
    const edge = r() * 4 | 0, t = r(), inset = Math.pow(r(), 2) * Math.min(w, h) * 0.18;
    const x = edge === 0 ? t * w : edge === 1 ? w - inset : edge === 2 ? t * w : inset;
    const y = edge === 0 ? inset : edge === 1 ? t * h : edge === 2 ? h - inset : t * h;
    const rr = 4 + r() * 26;
    const sg = g.createRadialGradient(x, y, 0, x, y, rr);
    sg.addColorStop(0, `rgba(165,115,55,${0.08 + r() * 0.14})`); sg.addColorStop(1, 'rgba(165,115,55,0)');
    g.fillStyle = sg; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  return c;
}

  ART.coin = buildSprite(12, 14, 6, 7, g => {

    let dx = p.x - q.x - player.vx * 0.012 + wind.x * 0.004, dy = p.y - q.y + 0.35 + Math.sin(ambT * 11 - i * 0.7) * 0.5 - player.vy * 0.008;

function updatePlayer(dt) {

    }

function spawnDrop(x, y, v) {

    let best = drops[0], bd = 1e12;

}
function updateDrops(dt) {
  const mag = BAL.MAGNET * S.magnetMul, vac = wave.phase === 'clear';
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];

    d.age = (d.age || 0) + dt;
    if (!d.pull && (vac || dist < mag)) { d.pull = true; d.t = 0; }
    if (!d.pull && d.age > 5 && dist < 700) { d.vx += dx / dist * 40 * dt; d.vy += dy / dist * 40 * dt; }
    if (d.pull) {
      d.t += dt;
      const sp = 240 + d.t * 420;
      d.vx += (dx / dist * sp - d.vx) * Math.min(1, 9 * dt); d.vy += (dy / dist * sp - d.vy) * Math.min(1, 9 * dt);
    } else { d.vx *= Math.max(0, 1 - 5 * dt); d.vy *= Math.max(0, 1 - 5 * dt); }
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (dist < BAL.PICKUP + 4) { gainXp(d.v); dropPool.push(d); drops[i] = drops[drops.length - 1]; drops.pop(); }
  }
}
function xpNeed(lv) { return lv <= XP.EARLY.length ? XP.EARLY[lv - 1] : Math.round(XP.BASE + (lv - 1) * XP.GROWTH); }
function gainXp(v) {
  prog.xp += v * S.xpMul;
  pickStreak = ambT - pickT < 0.35 ? Math.min(pickStreak + 1, 24) : 0; pickT = ambT;
  SFX.play('pickup', pickStreak);

}

function damagePlayer() {

  for (const e of queryList(player.x, player.y, BAL.PLAYER_RADIUS + 60)) {
    if (e.dead || e.z > 10 || !e.dmg) continue;

// 플레이어 피해: 회피·수벽·방어·노호·부활이 모두 여기서 처리된다

function addPts(t, n) { build.pts[t] = (build.pts[t] || 0) + n; }
function recalc() {

    if (p.id === 'hoshi') s.crit += 0.06 * L;
    if (p.id === 'scale') s.regen += 0.3 * L;

  if (P('狐') >= 2) s.crit += 0.1; if (P('狐') >= 4) s.foxOnKill = true;
  if (full('狐') === 'A') s.dodge += 0.2; else if (full('狐') === 'B') { s.critMul += 1; s.goldMul *= 1.3; }
  if (P('龍') >= 2) s.regen += 0.5; if (P('龍') >= 4) s.chain = 0.12;
  if (full('龍') === 'A') s.shieldEvery = 8; else if (full('龍') === 'B') s.chain = Math.max(s.chain, 0.25);

function biomeAt(cx, cy) {
  const h = hash2(Math.floor(cx / PROPS.REGION), Math.floor(cy / PROPS.REGION), 501);
  return h < 0.24 ? 'bamboo' : h < 0.44 ? 'pine' : h < 0.6 ? 'shrine' : h < 0.72 ? 'water' : 'open';
}
function makePropInst(type, x, y, h) {
  const arr = ART.props[type], art = arr[Math.floor(h * 997) % arr.length];
  const flip = (type === 'torii' || type === 'pond' || type === 'chochin') ? 1 : (h * 7919 % 1 < 0.5 ? -1 : 1);
  return {
    prop: true, type, art, x, y, flip, seed: h * 100, rot: 0,
    colliders: art.col.map(([cx, cy, r]) => ({ x: x + cx * flip, y: y + cy, r })),
  };
}
function genChunk(cx, cy) {
  const list = [], C = PROPS.CHUNK, ox = cx * C, oy = cy * C, b = biomeAt(cx, cy);
  const H = k => hash2(cx, cy, 700 + k);
  const add = (type, x, y, h) => { if (Math.hypot(x, y) > PROPS.CLEAR_RADIUS) list.push(makePropInst(type, x, y, h)); };
  if (b === 'shrine' && H(0) < 0.5) { // 도리이 + 초롱 한 쌍 + 석등 한 쌍
    const x = ox + C / 2 + (H(1) - 0.5) * 80, y = oy + C / 2 + (H(2) - 0.5) * 60;
    if (Math.hypot(x, y) > PROPS.CLEAR_RADIUS + 80) {
      add('torii', x, y, H(3)); add('chochin', x - 64, y + 16, 0.1); add('chochin', x + 72, y + 16, 0.6);
      add('ishidoro', x - 58, y + 96, H(4)); add('ishidoro', x + 58, y + 96, H(5));
    }
    return list;
  }
  if (b === 'water' && H(0) < 0.55) { // 연못 + 돌다리
    const x = ox + C / 2, y = oy + C / 2 + (H(1) - 0.5) * 60;
    if (Math.hypot(x, y) > PROPS.CLEAR_RADIUS + 160) { add('pond', x, y, H(2)); if (H(3) < 0.6) add('ishidoro', x + 120, y - 104, H(4)); }
    return list;
  }
  for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) {
    const p = hash2(cx * 2 + sx, cy * 2 + sy, 610), h = hash2(cx * 2 + sx, cy * 2 + sy, 611);
    const x = ox + sx * C / 2 + 35 + hash2(cx * 2 + sx, cy * 2 + sy, 612) * (C / 2 - 70);
    const y = oy + sy * C / 2 + 35 + hash2(cx * 2 + sx, cy * 2 + sy, 613) * (C / 2 - 70);

    else if (b === 'pine') type = p < 0.5 ? 'pine' : p < 0.6 ? 'ishidoro' : null;
    else if (b === 'shrine') type = p < 0.25 ? 'ishidoro' : p < 0.4 ? 'chochin' : p < 0.5 ? 'pine' : null;
    else if (b === 'water') type = p < 0.3 ? 'bamboo' : p < 0.42 ? 'ishidoro' : null;

  const cx0 = Math.floor((camX - mx) / C), cx1 = Math.floor((camX + mx) / C);

function updateWind(dt) {
  const w = wind;
  if (w.phase === 'calm') {
    w.t -= dt;
    if (w.t <= 0) { w.phase = 'rise'; w.peak = rand(WIND.GUST_MIN, WIND.GUST_MAX); w.dir = Math.random() < 0.72 ? 1 : -1; }
  } else if (w.phase === 'rise') {
    w.gust += dt / WIND.RISE;
    if (w.gust >= 1) { w.gust = 1; w.phase = 'hold'; w.hold = rand(WIND.HOLD_MIN, WIND.HOLD_MAX); }
  } else if (w.phase === 'hold') {
    w.hold -= dt; if (w.hold <= 0) w.phase = 'fall';
  } else {
    w.gust -= dt / WIND.FALL;
    if (w.gust <= 0) { w.gust = 0; w.phase = 'calm'; w.t = rand(WIND.INTERVAL_MIN, WIND.INTERVAL_MAX); }
  }
  const g = smooth(clamp(w.gust, 0, 1));
  w.x = WIND.BASE * (1 - g) + g * w.peak * w.dir + Math.sin(performance.now() / 1700) * 5;

  // 바람 결 붓 터치
  const strength = Math.abs(w.x);
  if (strength > 90 && streaks.length < Q.streaks && Math.random() < dt * strength / 40) {
    const s = { spr: ART.streaks[Math.random() * 3 | 0], x: w.x > 0 ? rand(-360, W * 0.4) : rand(W * 0.6, W + 60), y: rand(0, H), life: rand(0.6, 1.1), a: rand(0.12, 0.22) };
    s.max = s.life; streaks.push(s);
  }
  for (let i = streaks.length - 1; i >= 0; i--) {
    const s = streaks[i]; s.life -= dt; s.x += w.x * 3.2 * dt; s.y += Math.sin(s.life * 3) * 8 * dt;
    if (s.life <= 0) { streaks[i] = streaks[streaks.length - 1]; streaks.pop(); }
  }
}

function initWorldPetal(p, mode) {
  p.size = rand(9, 15); p.v = Math.random() * ART.petals.length | 0;
  p.z = rand(PETAL.SPAWN_Z_MIN, PETAL.SPAWN_Z_MAX);
  let sx, sy;
  if (mode === 0) { sx = rand(-40, W + 40); sy = rand(-40, H + 40); }
  else if (mode === 1) { sx = rand(-60, W + 60); sy = rand(-60, -20); }
  else { sx = wind.x > 0 ? rand(-90, -30) : rand(W + 30, W + 90); sy = rand(-40, H); }
  p.x = camX - W / 2 + sx; p.y = camY - H / 2 + sy + p.z;
  p.fall = rand(PETAL.FALL_MIN, PETAL.FALL_MAX);
  p.vx = wind.x * 0.8; p.vy = 0; p.vz = -p.fall;
  p.rot = rand(0, TAU); p.vr = rand(-2.2, 2.2); p.flip = rand(0, TAU); p.vf = rand(1.5, 4) * (Math.random() < 0.5 ? -1 : 1);
  p.sway = rand(10, 26); p.swf = rand(0.8, 1.8); p.ph = rand(0, TAU);
  p.ground = false; p.life = 0; p.fade = mode === 0 ? 0 : 1; p.cd = 0;
}
function initScreenPetal(p, layer, anywhere) {
  const front = layer === 'front';
  p.size = front ? rand(22, 34) : rand(5.5, 9);
  p.v = Math.random() * ART.petals.length | 0;
  p.fall = front ? rand(70, 120) : rand(18, 34);
  p.resp = front ? 1.45 : 0.6; p.par = front ? 1.55 : 0.55;
  p.rot = rand(0, TAU); p.vr = rand(-2.5, 2.5); p.flip = rand(0, TAU); p.vf = rand(2, 5) * (Math.random() < 0.5 ? -1 : 1);
  p.sway = front ? rand(25, 50) : rand(6, 14); p.swf = rand(0.7, 1.6); p.ph = rand(0, TAU);
  p.alpha = front ? rand(0.82, 0.95) : rand(0.35, 0.6);
  p.vx = wind.x * p.resp;
  if (anywhere) { p.x = rand(0, W); p.y = rand(0, H); }
  else if (Math.abs(wind.x) > 80 && Math.random() < 0.6) { p.x = wind.x > 0 ? -40 : W + 40; p.y = rand(-20, H * 0.8); }

function resetPetals() {
  worldPetals.forEach(p => wpPool.push(p)); worldPetals.length = 0;
  for (let i = 0; i < Q.petalWorld; i++) { const p = wpPool.pop() || {}; initWorldPetal(p, 0); p.fade = 1; worldPetals.push(p); }
  frontPetals.length = 0; backPetals.length = 0;
  for (let i = 0; i < Q.petalFront; i++) { const p = {}; initScreenPetal(p, 'front', true); frontPetals.push(p); }
  for (let i = 0; i < Q.petalBack; i++) { const p = {}; initScreenPetal(p, 'back', true); backPetals.push(p); }
}

function kickPetal(p, dx, dy, f, vz) {
  p.vx += dx * f; p.vy += dy * f;
  if (p.ground) { p.ground = false; p.z = 0.5; p.life += 1; }
  p.vz = vz; p.vr = rand(-8, 8); p.vf = rand(6, 12) * (Math.random() < 0.5 ? -1 : 1); p.cd = 0.35;
}

function updatePetals(dt) {
  const t = performance.now() / 1000, wx = wind.x, wabs = Math.abs(wx);
  const gust = wind.gust;
  const pspeed = Math.hypot(player.vx, player.vy);
  const scatter = state === 'play' && pspeed > 40;
  const R = PETAL.SCATTER_RADIUS;
  let air = 0, ground = 0;
  for (let i = worldPetals.length - 1; i >= 0; i--) {
    const p = worldPetals[i];
    p.cd = Math.max(0, p.cd - dt);
    if (p.fade < 1) p.fade = Math.min(1, p.fade + dt * 1.2);
    if (!p.ground) {
      const sw = Math.sin(t * p.swf + p.ph);
      p.vx += (wx * 0.85 + sw * p.sway - p.vx) * 1.8 * dt;
      p.vy += (Math.cos(t * p.swf * 0.7 + p.ph) * p.sway * 0.35 - p.vy) * 1.5 * dt;
      p.vz += (-p.fall - p.vz) * 1.6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.rot += (p.vr + wx * 0.01) * dt; p.flip += p.vf * (1 + wabs / 150) * dt;
      if (p.z <= 0) { // 착지
        p.z = 0; p.ground = true; p.vx *= 0.3; p.vy *= 0.3;
        if (p.life <= 0) p.life = rand(PETAL.GROUND_LIFE_MIN, PETAL.GROUND_LIFE_MAX);
        const c = Math.cos(p.flip); p.gsy = (c >= 0 ? 1 : -1) * Math.max(Math.abs(c), 0.55);
        if (ground >= Q.ground) { // 상한 초과: 가장 오래된 꽃잎부터 빨리 사라지게
          let o = null;
          for (const q of worldPetals) if (q.ground && q !== p && (!o || q.life < o.life)) o = q;
          if (o) o.life = Math.min(o.life, 0.5);
        }
      }
    } else {
      p.life -= dt;
      const fr = Math.max(0, 1 - 4 * dt); p.vx *= fr; p.vy *= fr;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (gust > 0.5 && p.cd <= 0 && Math.random() < dt * 0.5 * gust) kickPetal(p, Math.sign(wx), rand(-0.3, 0.3), wabs * 0.35, rand(25, 60));
    }
    // 플레이어가 지나가면 흩어짐
    if (scatter && p.cd <= 0 && p.z < 14) {
      const dx = p.x - player.x, dy = p.y - player.y, d2 = dx * dx + dy * dy;
      if (d2 < R * R) {
        const d = Math.sqrt(d2) || 1, f = 1 - d / R;
        kickPetal(p, dx / d, dy / d, PETAL.SCATTER_FORCE * f + 30, rand(40, 100) * f + 25);
        p.vx += player.vx * 0.35; p.vy += player.vy * 0.35;
      }
    }
    const sx = p.x - camX + W / 2, sy = p.y - p.z - camY + H / 2;
    const off = sx < -220 || sx > W + 220 || sy < -260 || sy > H + 220;
    if (off || (p.ground && p.life <= 0)) { wpPool.push(p); worldPetals[i] = worldPetals[worldPetals.length - 1]; worldPetals.pop(); continue; }
    if (p.ground) ground++; else air++;
  }
  const target = Q.petalWorld * (1 + gust * 0.6);
  let spawn = 0;
  while (air < target && spawn < 5) {
    const p = wpPool.pop() || {};
    const mode = gust > 0.3 && Math.random() < 0.6 ? 2 : Math.random() < 0.55 ? 0 : 1;
    initWorldPetal(p, mode); worldPetals.push(p); air++; spawn++;
  }
  // 화면 공간 레이어 (앞: 크고 빠름 / 뒤: 작고 흐림)
  for (const [arr, layer] of [[frontPetals, 'front'], [backPetals, 'back']]) {
    for (const p of arr) {
      const sw = Math.sin(t * p.swf + p.ph);
      p.vx += (wx * p.resp + sw * p.sway - p.vx) * 2 * dt;
      p.x += p.vx * dt - camDX * p.par;
      p.y += (p.fall + Math.cos(t * p.swf * 0.8 + p.ph) * p.sway * 0.3) * dt - camDY * p.par;
      p.rot += p.vr * dt; p.flip += p.vf * (1 + wabs / 140) * dt;
      if (p.y > H + 60 || p.x < -90 || p.x > W + 90 || p.y < -120) initScreenPetal(p, layer, false);
    }
  }
}

  Object.assign(player, { x: 0, y: 0, vx: 0, vy: 0, hp: BAL.PLAYER_HP, maxHp: BAL.PLAYER_HP, hpShow: BAL.PLAYER_HP, iframe: 0, face: 1, tilt: 0, tiltV: 0, phase: 0, move: 0, crumple: 0 });
  const start = meta.unlocked[meta.start] ? meta.start : 'ofuda';
  Object.assign(build, { weapons: [{ id: start, lv: 1, t: 0.4, evo: false }], passives: [], lineage: null, pts: {}, bless: new Set(), rerolls: WAVE.REROLLS + (meta.tracks.spirit.lv >= 5 ? 1 : 0) + (meta.tracks.spirit.lv >= 15 ? 1 : 0), lineForm: null, revive: 0, picks: 0 });
  Object.assign(timers, { feather: 0, quake: 5, shield: 0, shieldUp: false });
  for (const k in runDmg) delete runDmg[k];
  Object.assign(prog, { level: 1, xp: 0, need: xpNeed(1), pendingLevels: 0, pendingLegend: 0, pendingForm: false, elites: 0, gold: 0, goldGiven: false, newBest: false });
  recalc(); player.hp = player.maxHp; player.hpShow = player.hp;
  player.form = null; player.scarf = []; player.ghosts = []; updateForm(false); petSetup();
  camX = 0; camY = -18; time = 0; kills = 0; state = 'play'; overT = 0; hintT = 0; moved = false; tearSnap = null;

}
function toTitle() {

  state = 'title'; menu.screen = 'main'; menu.t = 0; tearSnap = null; resetRunExtras(); setupRun(meta.journey.sel, meta.journey.shuraSel);

// 런이 끝나면 금박 정산 (한 번만)
// 게임오버: 지금 화면을 찍어 두고 종이처럼 찢는다
function snapTear() {
  tearSnap = makeCanvas(cv.width, cv.height);
  tearSnap.getContext('2d').drawImage(cv, 0, 0);
  const r = rng32((Math.random() * 1e6) | 0), n = 18;
  tearPts = [];
  for (let i = 0; i <= n; i++) tearPts.push([W * (0.47 + (r() - 0.5) * 0.12), -20 + i * (H + 40) / n]);
  SFX.play('tear');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (hitstop > 0 && (state === 'play' || state === 'dying')) { hitstop -= dt; render(); requestAnimationFrame(frame); return; }
  if (state !== 'pause') {
    ambT += dt;
    updateWind(dt);
    collectProps();
    if (execFx && !execFx.done && state === 'play') { // 처형하는 동안 세상이 멈춘다
      execFx.t += dt; if (execFx.t >= SOUL.EXEC_TIME) finishExecute();
      render(); requestAnimationFrame(frame); return;
    }
    if (ultFx && !ultFx.struck && state === 'play') { // 오의 컷인 동안 세상이 멈춘다
      ultFx.t += dt; if (ultFx.t >= ACT.ULT_CUT) ultStrike();
      render(); requestAnimationFrame(frame); return;
    }
    if (state === 'title') {
      menu.t += dt; updateTitleFx(dt);
      player.x += 22 * dt; player.y += Math.sin(ambT * 0.2) * 6 * dt; // 배경이 천천히 흘러감
    } else if (state === 'play') {
      const rdt = dt; let wd = dt;
      if (slowmo > 0) { slowmo -= rdt; wd = dt * SOUL.SLOWK; } // 튕겨내기 직후 세상이 느려진다
      time += wd; hintT += rdt;
      updatePlayer(wd);
      updateEnemies(wd);
      resolvePropCollisions();
      updateWeapons(wd);
      updateShots(wd);
      updateZones(wd);
      updateWarns(wd);
      if (state === 'play') damagePlayer();
      updateDrops(wd);
      updateExtras(wd); updateGuard(rdt);
      for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) { enemyPool.push(enemies[i]); enemies[i] = enemies[enemies.length - 1]; enemies.pop(); }
      buildGrid(); // 정리 뒤 격자를 다시 맞춘다 (불타 죽는 적의 폭발이 다음 프레임 초반에 격자를 쓴다)
      if (state === 'play') updateWave(dt);
      checkPendingCards();
      if (state === 'play') updateForm(true);
    } else if (state === 'cards') {
      updateCards(dt);
    } else if (state === 'dying') {
      overT += dt; player.vx *= 0.9; player.vy *= 0.9;
      if (overT > 1.4) { render(); snapTear(); state = 'over'; overT = 0; }
    } else if (state === 'over' || state === 'win') overT += dt;
    if (state === 'win' && !tearSnap) { render(); snapTear(); overT = 0; }
    updateFx(dt);
    flash.a = Math.max(0, flash.a - dt * 2.6);
    updateParticles(dt);
    updateDecals(dt);
    updateCamera(dt);
    updatePetals(dt);
    for (let i = ui.marks.length - 1; i >= 0; i--) { ui.marks[i].t += dt; if (ui.marks[i].t > 3) ui.marks.splice(i, 1); }
  }
  render();
  requestAnimationFrame(frame);
}

const toSX = x => x - renderCX + W / 2;
const toSY = y => y - renderCY + H / 2;

// 회전·좌우반전·세로 비율을 한 번에 적용해 그리기
function drawImg(img, w, h, ox, oy, x, y, rot, sx, sy) {
  const c = Math.cos(rot), s = Math.sin(rot);
  ctx.setTransform(D * c * sx, D * s * sx, -D * s * sy, D * c * sy, D * x, D * y);
  ctx.drawImage(img, -ox, -oy, w, h);
}

function drawBackground() {
  const T = TILE_LOGICAL;
  const ox = (((renderCX - W / 2) % T) + T) % T, oy = (((renderCY - H / 2) % T) + T) % T;
  ctx.setTransform(D, 0, 0, D, -ox * D, -oy * D);
  ctx.fillStyle = bgPattern; ctx.fillRect(0, 0, W + T, H + T);

  // 청크마다 결정적으로 배치되는 얼룩 · 접힌 자국
  const CH = 420, m = 420;
  const cx0 = Math.floor((renderCX - W / 2 - m) / CH), cx1 = Math.floor((renderCX + W / 2 + m) / CH);
  const cy0 = Math.floor((renderCY - H / 2 - m) / CH), cy1 = Math.floor((renderCY + H / 2 + m) / CH);
  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    if (hash2(cx, cy, 11) < 0.32) {
      const s = ART.stains[hash2(cx, cy, 12) * ART.stains.length | 0];
      const x = toSX(cx * CH + hash2(cx, cy, 13) * CH), y = toSY(cy * CH + hash2(cx, cy, 14) * CH);
      const sc = 0.7 + hash2(cx, cy, 15) * 0.6;
      if (x > -s.w && x < W + s.w && y > -s.h && y < H + s.h) drawImg(s.c, s.w, s.h, s.ox, s.oy, x, y, hash2(cx, cy, 16) * TAU, sc, sc);
    }
    if (hash2(cx, cy, 21) < 0.13) {
      const s = ART.creases[hash2(cx, cy, 22) * ART.creases.length | 0];
      const x = toSX(cx * CH + hash2(cx, cy, 23) * CH), y = toSY(cy * CH + hash2(cx, cy, 24) * CH);
      drawImg(s.c, s.w, s.h, s.w / 2, s.oy, x, y, hash2(cx, cy, 25) * Math.PI, 1, 1);
    }
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  for (const p of visProps) { // 연못처럼 바닥에 붙는 소품
    if (!p.art.ground) continue;
    const s = p.art.spr, x = toSX(p.x), y = toSY(p.y);
    if (x < -s.ox || x > W + s.ox || y < -s.oy || y > H + s.oy) continue;
    drawImg(s.c, s.w, s.h, s.ox, s.oy, x, y, 0, p.flip, 1);
  }
  for (const d of decals) {
    if (d.life <= 0) continue;
    const x = toSX(d.x), y = toSY(d.y);
    if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
    ctx.globalAlpha = Math.min(1, d.life / 2) * 0.9;
    drawImg(d.spr.c, d.spr.w, d.spr.h, d.spr.ox, d.spr.oy, x, y, d.rot, d.scale, d.scale * 0.8);
  }
  // 바닥 꽃잎 + 공중 꽃잎의 그림자
  for (const p of worldPetals) {
    const x = toSX(p.x), y = toSY(p.y);
    if (p.ground) {
      const k = p.size / 20, set = ART.petals[p.v];
      ctx.globalAlpha = Math.min(1, p.life / PETAL.GROUND_FADE) * p.fade;
      drawImg(p.gsy >= 0 ? set.front : set.back, 28, 28, 14, 14, x, y, p.rot, k, k * Math.abs(p.gsy));
    } else if (p.z < 220) {
      ctx.globalAlpha = 0.1 * (1 - p.z / 220) * p.fade;
      ctx.setTransform(D, 0, 0, D, 0, 0);
      ctx.fillStyle = 'rgb(90,55,35)';
      ctx.beginPath(); ctx.ellipse(x, y, p.size * 0.32, p.size * 0.2, 0, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawScreenPetals(arr, soft) {
  for (const p of arr) {
    const set = ART.petals[p.v], c = Math.cos(p.flip), k = p.size / 20;
    const img = c >= 0 ? (soft ? set.frontSoft : set.front) : (soft ? set.backSoft : set.back);
    ctx.globalAlpha = p.alpha;
    drawImg(img, 28, 28, 14, 14, p.x, p.y, p.rot, k * (0.85 + 0.15 * Math.abs(Math.sin(p.flip))), k * Math.max(0.08, Math.abs(c)));
  }
  ctx.globalAlpha = 1;
}

function drawAirPetals() {
  for (const p of worldPetals) {
    if (p.ground) continue;
    const x = toSX(p.x), y = toSY(p.y - p.z);
    if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    const set = ART.petals[p.v], c = Math.cos(p.flip), k = p.size / 20;
    ctx.globalAlpha = p.fade;
    drawImg(c >= 0 ? set.front : set.back, 28, 28, 14, 14, x, y, p.rot, k * (0.85 + 0.15 * Math.abs(Math.sin(p.flip))), k * Math.max(0.08, Math.abs(c)));
  }
  ctx.globalAlpha = 1;
}

// 우키요에 띠: 위쪽 먼 산, 아래쪽 파도. 카메라보다 느리게 가로로 흐른다
function drawBands() {
  ctx.setTransform(D, 0, 0, D, 0, 0);
  const tile = (img, par, y, h, alpha) => {
    const dw = img.width * (h / img.height);
    let x = -(((renderCX * par) % dw) + dw) % dw;
    ctx.globalAlpha = alpha;
    for (; x < W; x += dw) ctx.drawImage(img, x, y, dw + 1, h);
  };
  const mh = Math.min(240, H * 0.3);
  tile(ART.mtnBand, PROPS.BAND_MTN_PAR, -14 + clamp(-renderCY * 0.025, -24, 24), mh, PROPS.BAND_MTN_ALPHA);
  const wh = Math.min(200, H * 0.24);
  tile(ART.waveBand, PROPS.BAND_WAVE_PAR, H - wh * 0.92 + clamp(-renderCY * 0.04, -16, 16), wh * 1.15, PROPS.BAND_WAVE_ALPHA);
  ctx.globalAlpha = 1;
}

// 초롱 · 석등 불빛: 은은하게 깜빡임
function drawGlows() {
  const t = ambT;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of visProps) {
    const gl = p.art.glow; if (!gl) continue;
    const c = Math.cos(p.rot), s = Math.sin(p.rot), lx = gl[0] * p.flip, ly = gl[1];
    const x = toSX(p.x + lx * c - ly * s), y = toSY(p.y + lx * s + ly * c);
    if (x < -90 || x > W + 90 || y < -90 || y > H + 90) continue;
    const f = 0.72 + 0.28 * (0.5 + 0.5 * Math.sin(t * 9 + p.seed) * Math.sin(t * 5.3 + p.seed * 2.1));
    ctx.globalAlpha = PROPS.GLOW_ALPHA * f;
    drawImg(ART.glowBig, 160, 160, 80, 80, x, y, 0, 1, 1);
    ctx.globalAlpha = 0.32 * f;
    drawImg(ART.glowCore, 40, 40, 20, 20, x, y, 0, 1, 1);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

// 주인공의 움직이는 부품 (목도리, 날개, 꼬리, 감는 용, 불길, 여우불, 발밑 기운)
const SPIRIT_RGB = { tsuru: '255,236,200', neko: '190,160,255', tanuki: '235,200,120' };
const SPIRIT_LINE = { tsuru: PAL.odo, neko: '#6b5aa8', tanuki: '#8a6a3c' };
const tintCache = new Map();
function tinted(name, spr, color, a) { // 스프라이트에 색을 덧입힌 사본 (금빛 꼬리, 흑룡 머리 등)
  const key = name + color + a;
  let o = tintCache.get(key);
  if (!o) {
    const c = makeCanvas(spr.c.width, spr.c.height), g = c.getContext('2d');
    g.drawImage(spr.c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = a; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
    o = { c, w: spr.w, h: spr.h, ox: spr.ox, oy: spr.oy }; tintCache.set(key, o);
  }
  return o;
}
// 몸에 붙지 않고 따로 움직이는 부품: 날개 · 꼬리 · 목도리 · 기운 · 후광 · 부적
// pv가 있으면 화면용 미리보기 (수련 화면 · 카드)
function drawPlayerParts(x, y, tilt, layer, alpha, F = player.form.f, pv = null) {
  const face = pv ? pv.face : player.face, move = pv ? 0 : player.move, t = ambT;
  const TK = F.tk, LF = F.lf || 'A', lcol = F.line ? LINE[F.line].color : PAL.odo;
  const brOf = k => TK[k].lv >= TRACK.BRANCH_AT ? TK[k].br : null;
  const cs = Math.cos(tilt), sn = Math.sin(tilt);
  const at = (px, py) => [x + cs * face * px - sn * py, y + sn * face * px + cs * py]; // 몸 좌표 → 화면
  const sp = TK.spirit.lv, spBr = brOf('spirit'), spRGB = SPIRIT_RGB[spBr] || '255,215,150';
  const foxB = F.line === '狐' && F.tier >= 3 && LF === 'B';
  ctx.setTransform(D, 0, 0, D, 0, 0);
  if (layer === 'back') {
    if (sp >= 1) { // 수호령의 기운: 발밑을 도는 점선 고리
      const k = Math.min(sp, 16) / 16;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (0.08 + k * 0.16 + (sp >= 20 ? 0.14 : 0)) * alpha;
      drawImg(glowSprite(spRGB), 64, 64, 32, 32, x, y + 1, 0, 0.8 + k * 0.8, 0.32 + k * 0.3);
      ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(D, 0, 0, D, 0, 0);
      ctx.globalAlpha = (0.3 + k * 0.45) * alpha; ctx.strokeStyle = SPIRIT_LINE[spBr] || PAL.odo; ctx.lineWidth = 1.1 + k * 1.1;
      ctx.setLineDash([3, 5]); ctx.lineDashOffset = -t * 14;
      ctx.beginPath(); ctx.ellipse(x, y + 1, 17 + k * 11, 6 + k * 4, 0, 0, TAU); ctx.stroke();
      if (sp >= 12) { ctx.lineDashOffset = t * 10; ctx.beginPath(); ctx.ellipse(x, y + 1, 24 + k * 12, 8.5 + k * 4.5, 0, 0, TAU); ctx.stroke(); }
      ctx.setLineDash([]); ctx.lineDashOffset = 0;
    }
    if (F.stage >= 2) { // 발밑 기운: 돌아가는 붓 고리
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.18 * alpha;
      drawImg(glowSprite('255,205,130'), 64, 64, 32, 32, x, y + 1, 0, 1.3, 0.5);
      ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(D, 0, 0, D, 0, 0);
      ctx.globalAlpha = 0.6 * alpha; ctx.strokeStyle = lcol; ctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) { const a0 = t * 1.6 + k * TAU / 3; ctx.lineWidth = 2.6 - k * 0.5; ctx.beginPath(); ctx.ellipse(x, y + 1, 26, 9, 0, a0, a0 + 1.5); ctx.stroke(); }
    }
    if (TK.hat.lv >= 16 || foxB) { // 머리 뒤 후광
      const [hx, hy] = at(0, -41), R = foxB ? 21 : 17, strong = TK.hat.lv >= 20 || foxB;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (strong ? 0.5 : 0.28) * alpha;
      drawImg(glowSprite('255,215,140'), 64, 64, 32, 32, hx, hy, 0, R / 24, R / 24);
      ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(D, 0, 0, D, 0, 0);
      ctx.globalAlpha = 0.85 * alpha; ctx.strokeStyle = PAL.odo; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(hx, hy, R, 0, TAU); ctx.stroke();
      ctx.lineWidth = 1.3;
      for (let k = 0; k < 12; k++) { const a = t * 0.6 + k * TAU / 12, r2 = R + (k % 2 ? 3.5 : 7); ctx.beginPath(); ctx.moveTo(hx + Math.cos(a) * (R + 2), hy + Math.sin(a) * (R + 2)); ctx.lineTo(hx + Math.cos(a) * r2, hy + Math.sin(a) * r2); ctx.stroke(); }
    }
    if (F.line === '鬼' && F.tier >= 3) { // 오니의 불길 (청귀는 서리 불꽃)
      const blue = LF === 'B';
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 5; k++) {
        const fl = 0.7 + 0.3 * Math.sin(t * 13 + k * 2.1), fx = x + (k - 2) * 8, fh = (26 + k % 2 * 10) * fl;
        ctx.globalAlpha = (blue ? 0.18 : 0.14) * alpha; ctx.fillStyle = blue ? (k % 2 ? 'rgb(110,170,255)' : 'rgb(190,230,255)') : (k % 2 ? 'rgb(255,120,60)' : 'rgb(255,180,90)');
        ctx.beginPath(); ctx.ellipse(fx + (k - 2) * 3, y - 14 - fh * 0.3, 6, fh * 0.55, (k - 2) * 0.12, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (F.line === '天狗' && F.tier >= 2) { // 검은 날개 (까마귀 텐구는 두 쌍)
      const fast = move > 0.3, flap = 0.12 + Math.sin(t * (fast ? 13 : 4)) * (fast ? 0.22 : 0.08), W0 = ART.wing;
      const pairs = F.tier < 3 ? [[0.72, 0, 0]] : LF === 'B' ? [[0.98, -0.18, -2], [0.8, 0.42, 4]] : [[1.22, 0, 0]];
      if (F.tier >= 3 && LF === 'A') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22 * alpha; drawImg(glowSprite('255,225,170'), 64, 64, 32, 32, x, y - 34, 0, 1.6, 1.1); ctx.globalCompositeOperation = 'source-over'; }
      const spr = F.tier >= 3 && LF === 'B' ? tinted('wingB', W0, '#1f2633', 0.5) : W0;
      ctx.globalAlpha = alpha;
      for (const [sc, da, dy] of pairs) for (const sd of [-1, 1]) drawImg(spr.c, spr.w, spr.h, spr.ox, spr.oy, x + sd * 4, y - 25 + dy, tilt - sd * (flap + da), (sd < 0 ? 1 : -1) * sc, sc);
    }
    if (F.line === '狐' && F.tier >= 2) { // 여우 꼬리 (구미호 아홉 · 천호 금빛 넷)
      const t3 = F.tier >= 3, n = t3 ? (foxB ? 4 : 9) : 3, spread = t3 ? (foxB ? 0.5 : 0.27) : 0.42, big = t3 ? (foxB ? 1.45 : 1.25) : 1.05;
      const spr = foxB ? tinted('tailGold', ART.tail, '#d9b45a', 0.55) : ART.tail;
      ctx.globalAlpha = alpha;
      for (let i = 0; i < n; i++) {
        const a = (i - (n - 1) / 2) * spread - face * 0.8 + Math.sin(t * 2.6 + i * 0.9) * 0.14;
        const k = 0.8 + 0.2 * Math.cos((i - (n - 1) / 2) * 0.5);
        drawImg(spr.c, spr.w, spr.h, spr.ox, spr.oy, x - face * 9, y - 9, a, k * big, k * big * 1.08);
      }
    }
    if (F.stage >= 1 || TK.scarf.lv >= 1) drawScarf(F, alpha, scarfPoints(x, y, face, F, !!pv));
  }
  if (F.line === '龍' && F.tier >= 3) drawDragonCoil(x, y, layer, alpha, LF === 'B');
  if (sp >= 16) { // 몸 둘레를 도는 부적
    const n = sp >= 20 ? 3 : 2, s0 = ART.ofuda;
    for (let i = 0; i < n; i++) {
      const a = t * 1.7 + i * TAU / n, z = Math.sin(a);
      if ((layer === 'front') !== (z >= 0)) continue;
      const ox = x + Math.cos(a) * 25, oy = y - 22 + z * 8 + Math.sin(t * 3 + i) * 2;
      if (sp >= 20) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4 * alpha; drawImg(glowSprite(spRGB), 64, 64, 32, 32, ox, oy, 0, 0.35, 0.35); ctx.globalCompositeOperation = 'source-over'; }
      ctx.globalAlpha = alpha; drawImg(s0.c, s0.w, s0.h, s0.ox, s0.oy, ox, oy, Math.sin(t * 2.5 + i) * 0.35, 0.7 + z * 0.12, 0.7 + z * 0.12);
    }
  }
  if (layer === 'front') {
    const sw = TK.sword;
    if (sw.lv >= TRACK.BRANCH_AT && sw.br) { // 속성이 깃든 칼날의 빛
      const b = TRACKS.sword.branches[sw.br], len = 24 + Math.min(sw.lv, 12) * 0.6 + (F.stage >= 1 ? 3 : 0);
      const k = sw.lv >= 20 ? 1 : sw.lv >= 16 ? 0.72 : 0.5, fl = 0.8 + 0.2 * Math.sin(t * 9);
      ctx.globalCompositeOperation = 'lighter';

    if (ctl) uiButton('set_' + i, getStamp(bs, ctl[0]), px + pw - 30 - bs, y, bs, true, ctl[1], ca);
    else {
      uiButton('vol_dn', getStamp(40, ['−']), px + pw - 30 - 140, y + 5, 40, st.vol > 0.05, () => { st.vol = Math.max(0, +(st.vol - 0.1).toFixed(2)); SFX.setVol(); saveMeta(); }, ca);
      uiButton('vol_up', getStamp(40, ['+']), px + pw - 30 - 40, y + 5, 40, st.vol < 1, () => { st.vol = Math.min(1, +(st.vol + 0.1).toFixed(2)); SFX.setVol(); saveMeta(); }, ca);
      ctx.globalAlpha = ca; ctx.textAlign = 'center'; ctx.font = `700 16px ${FONT_SERIF}`; ctx.fillStyle = PAL.sumi;
      ctx.fillText(`${Math.round(st.vol * 100)}`, px + pw - 30 - 70, y + 25);
    }
  });
  uiButton('back', getStamp(58, ['돌아', '가기']), W / 2 - 29, py + ph - 100, 58, true, () => goScreen('main'), ca);
  ctx.globalAlpha = 1;
}
function buildSummary() {
  const parts = [];
  if (build.lineage) parts.push(`${LINE[build.lineage].name} 혈통`);
  const tot = Object.values(runDmg).reduce((a, b) => a + b, 0);
  const top = Object.entries(runDmg).filter(([k]) => WEAP[k]).sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([k, v]) => { const w = build.weapons.find(x => x.id === k); return `${w && w.evo ? WEAP[k].evo.name : WEAP[k].name} ${Math.round(v / (tot || 1) * 100)}%`; });
  if (top.length) parts.push(top.join(' · '));
  return parts.join(' · ') || '혈통 없음';
}

function render() {
  ui.buttons.length = 0;
  ctx.setTransform(D, 0, 0, D, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  drawBackground();
  drawGround();
  drawZones();
  drawWarns();
  drawDrops();
  drawCoins();
  drawBands();
  drawScreenPetals(backPetals, Q.backBlur);
  drawEntities();
  drawChapterTint();
  if (state === 'play' || state === 'pause' || state === 'cards') drawGuardFx();
  drawGlows();
  drawHankoFalling();
  drawShots();
  drawEnemyShots();
  drawParticles();
  drawFx();
  if (state !== 'title') { drawDangerMarks(); drawPostureBars(); }
  drawAirPetals();
  drawStreaks();
  drawScreenPetals(frontPetals, false);

  // 와시 섬유 결 + 바랜 비네팅 (곱하기)
  ctx.setTransform(D, 0, 0, D, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(overlay, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  if (flash.a > 0.01) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(${flash.rgb},${flash.a * 0.5})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }

  if (state === 'title') { drawTitle(); drawMarks(); return; }
  if (state === 'play' || state === 'pause' || state === 'dying') { drawHUD(); drawCombatHud(); drawBossBar(); }
  drawWaveText();
  if (ultFx) drawUltCutin();
  if (execFx) drawExecCutin();
  if (state === 'cards') drawCards();
  if (state === 'pause') drawPanel('일시정지', coarse ? '바깥을 누르면 계속' : 'P 또는 Esc로 계속', [`${chapterLabel()} · 제 ${wave.n} 막 · 레벨 ${prog.level} · ${fmtTime(time)}`, buildSummary(), `연격 최고 ${run.bestCombo} · 금박 조각 ${Math.round(run.coinGold)}`],
    [{ id: 'resume', lines: ['계속'], onClick: togglePause }, { id: 'quit', lines: ['그만', '두기'], onClick: () => { finishRun(false); state = 'dying'; overT = 1.4; } }]);
  if (state === 'over' || state === 'win') drawResults(state === 'win');
  drawMarks();
}

/* =====================================================================
   10. 시작
   ===================================================================== */
function readSafe() {
  const cs = getComputedStyle(safeEl);
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
}
function resize() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight);
  D = Math.min(window.devicePixelRatio || 1, Q.dpr);
  cv.width = Math.round(W * D); cv.height = Math.round(H * D);
  overlay = buildOverlay(Math.ceil(W), Math.ceil(H));
  bgPattern = ctx.createPattern(ART.tile, 'repeat');
  const s = TILE_LOGICAL / ART.tile.width;
  if (bgPattern.setTransform) bgPattern.setTransform(new DOMMatrix([s, 0, 0, s, 0, 0]));
  readSafe();
  if (state === 'cards') layoutCards();
  // 연출 강도가 바뀌면 화면 꽃잎 수를 맞춤
  while (frontPetals.length > Q.petalFront) frontPetals.pop();
  while (backPetals.length > Q.petalBack) backPetals.pop();
  while (frontPetals.length < Q.petalFront) { const p = {}; initScreenPetal(p, 'front', true); frontPetals.push(p); }
  while (backPetals.length < Q.petalBack) { const p = {}; initScreenPetal(p, 'back', true); backPetals.push(p); }
}
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

buildArt();
resize();
recalc();
resetPetals();
camY = -18; state = 'title'; menu.t = 0;
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`46px "Nanum Brush Script"`), document.fonts.load(`700 14px "Gowun Batang"`), document.fonts.load(`40px "Yuji Syuku"`, '紙吹雪鬼龍狐天狗剣鏡玉雷渦扇棒星鶴墨印')])
    .then(() => buildUIArt()).catch(() => { });
}
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
